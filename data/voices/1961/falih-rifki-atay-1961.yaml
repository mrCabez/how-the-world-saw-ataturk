summary: >-
  In the foreword to his memoir Çankaya: Atatürk was a natural, mortal man who lost his temper, could be
  unjust on hearsay, and regretted it.
quote:
  text: >-
    Atatürk de, kızıp darılır, barışıp gene bozuşur, bazan huysuzluğu, bazan keyfi tutar, bir müddet herhangi
    bir dedikodunun etkisi altında haksızlığa kadar gider, sonra pişmanlık duyar, üstelik alayı, şakayı sever,
    fâniliği size bana benzer tabiî bir insandı.
  language: tr
  translation: >-
    Atatürk, too, was a natural human being, as mortal as you or I: he would get angry and take offence, make
    peace and fall out again, be now in a bad temper and now in a good one, go for a while as far as injustice
    under the sway of some piece of gossip and then feel remorse; and besides, he loved mockery and a joke.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  From 'Birinci Baskının Önsözü', the foreword to the first edition (Dünya Yayınları, 1961, two volumes), as
  reprinted in the later one-volume edition, whose own foreword is dated 2 March 1968; read in the archive.org
  copy of the Cumhuriyet reprint, PDF p. 3. The same foreword calls him 'pek hesaplı bir adam' (a man who
  calculated everything) and a leader 'kendi kendine vefalı' (faithful to himself) above his friendships, and
  says: 'O da bal veren bir çiçek değil, her çiçeğin kendine göre balını almasını bilen bir arı idi' (he was
  not a flower that gives honey but a bee that knew how to take its honey from every flower). Whether the book
  dwells on his drinking and loneliness, as the starting note had it, was not checked. A passage from its
  chapter 'İç Didişme' is a separate record (falih-rifki-atay-cankaya-1924).

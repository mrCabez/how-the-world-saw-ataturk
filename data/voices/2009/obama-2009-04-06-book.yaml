summary: >-
  Pays tribute to Atatürk, whose 'vision, tenacity and courage' put Turkey on the path of democracy and whose
  legacy inspires generations.
quote:
  text: >-
    I am honored to pay tribute to Mustafa Kemal Ataturk, a man whose vision, tenacity and courage put the
    Republic of Turkey on the path of democracy
  language: en
mediated_by: >-
  AP and Bloomberg, 6 Apr 2009 (the entry as the wire reporters gave it); Habertürk and T24 (the whole entry
  in Turkish)
caveat: >-
  The English is the entry as wire reports of the day give it; the page of the book was not seen. Bloomberg
  (Chen and Nichols) has 'I am honored to pay tribute to Mustafa Kemal Ataturk' and 'legacy continues to
  inspire generations around the world' as written in the visitors' book; Hürriyet Daily News paraphrases
  ('man with vision, tenacity and courage who put Turkey on the path of democracy'). Habertürk and T24 print
  the whole entry in one Turkish translation; Dengegazetesi gives a looser one. The entry goes on to promise
  support for 'Ataturk's vision of Turkey as a modern and prosperous democracy' and ends on 'peace at home,
  peace in the world'. His speech to the Assembly the same day is a separate record (obama-2009).

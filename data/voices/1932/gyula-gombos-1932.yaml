mediated_by: Erdem 2009 ← Budapest embassy reports
caveat: >-
  Source dates premiership differently (1930 in abstract vs Oct 1932 in Erdem; 1932 used). The Turkish is the
  envoy's report of what Gömbös told him on 14 October 1932, as Erdem prints it: “Benim kafam Türk’tür.
  Türklere karşı üç noktada pek güçlü bağlar ile merbutum. 1. Bir ırktan, Asyalı olmaklığımız. 2. Harbi
  Umumi’de Türklerden gördüğüm yüksek askerlik yeteneği. 3. Büyük reisinizin dehası ile yapılan büyük
  inkılaptır.” (My head is Turkish. Three things bind me strongly to the Turks: 1. that we are of one race,
  Asians; 2. the high soldierly ability I saw in the Turks in the Great War; 3. the great revolution made by
  the genius of your great leader.) In what language he spoke is not stated.

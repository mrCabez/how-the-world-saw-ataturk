caveat: >-
  Page 3, in the item 'Un nouveau remaniement du cabinet turc', subheaded 'Le gouvernement de Constantinople
  reste aux mains des nationalistes'. The whole sentence: 'En rapports étroits avec Mustapha Kemal, l'homme
  des Enver pacha et des Talaat, il dicte ses volontés à tous les gouvernements.' Its subject is the
  Constantinople Chamber, which the paper calls a 'Parlement-croupion' of 110 deputies 'composé exclusivement
  d'éléments extrêmes'; so the one who dictates is the Chamber, not Kemal.

caveat: >-
  Page 3, column 3, 'Nouvelles internationales', headline on two lines (masthead: 16th year, no. 3918, Monday
  30 October 1933). The item, datelined 'Ankara, 29 octobre', is unsigned. It reports the Soviet ambassador
  Souritz's congratulations ('son admiration pour les succès des dix ans de République … le créateur et le
  constructeur de cette grande œuvre'), telegrams from Kalinin, Molotov, Krestinski, von Papen and
  Paul-Boncour, and ends: 'De grandes fêtes ont été célébrées par les ordres de l'autorité dans toutes les
  villes de Turquie.' The 'par les ordres de l'autorité' sentence therefore belongs to the item. No view of
  the paper's own.

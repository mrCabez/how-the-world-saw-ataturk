summary: >-
  Recalled that Mustapha Kemal's victory in 1922 caused the 'catastrophic failure' of Greek megalomania, as
  background to Greek-Turkish friendship.
quote:
  text: >-
    Depuis l'été de 1922, où la victoire de Mustapha Kemal provoqua la faillite catastrophique de la
    mégalomanie grecque, la Grèce s'est résignée : de la « Grande Idée » d'une nouvelle Byzance hellénique, il
    ne lui reste que le souvenir d'immenses illusions chèrement payées.
  language: fr
  translation: >-
    Since the summer of 1922, when Mustapha Kemal's victory caused the catastrophic bankruptcy of Greek
    megalomania, Greece has resigned herself: of the 'Great Idea' of a new Hellenic Byzantium, nothing remains
    but the memory of immense illusions dearly paid for.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  'Du nouveau dans les Balkans', signed Jacques Arnauld (not Bainville or Maurras), from the foot of page 1,
  column 6 to page 2 (masthead: 26th year, no. 304, Tuesday 31 October 1933); the sentence crosses the page
  turn ('méga-' / 'lomanie'). Kemal is named only here; the rest is about Bulgaria, the Little Entente and
  France. Next: 'Et vite, la Grèce … comprit qu'un seul parti lui restait : se réconcilier avec son vainqueur.
  Ainsi naquit l'amitié gréco-turque.'

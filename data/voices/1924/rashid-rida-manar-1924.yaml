summary: >-
  Abolition's defenders include Mustafa Kemal and his party; the Kemalists no longer care whether the Muslim
  world is pleased or angry.
quote:
  text: بل أقول انهم أصبحوا لا يبالون بالعالم الاسلامي رضي أم سخط
  language: ar
  translation: >-
    indeed I say they have come not to care about the Islamic world, whether it be pleased or angry
  translated_by: "machine: research agent"
caveat: >-
  al-Manar vol. 25, part 4, p. 285, in the article 'إلغاء الترك للخلافة والمصالح الاسلامية' (The Turks'
  abolition of the caliphate and the interests of Islam). The title page of the part is dated 30 Ramadan 1342
  / 4 May 1924, and that is the date given here. 'They' are 'هؤلاء الكماليون' (these Kemalists); the sentence
  goes on: 'اذا كان رضاه أو سخطه لا يؤثر في الشعب التركي تأثيراً يحمله على معارضة الحكومة' (so long as its
  pleasure or anger does not move the Turkish people to oppose the government). Higher on the page, of those
  who defended the abolition by what earlier Turks had done to the Abbasid caliphate: 'وهذا رأي مصطفى كمال
  وحزبه كما يعلم من خطبته التي جعلها مقدمة لهذا العمل' (this is the view of Mustafa Kemal and his party, as is
  known from the speech he made the preface to this act). The Arabic is spelled as printed, without hamzas. In
  the archive.org PDF the page is no. 210.
node: Al-Manar 25(4), 1924 — Rida on Ankara's Disregard of the Muslim World

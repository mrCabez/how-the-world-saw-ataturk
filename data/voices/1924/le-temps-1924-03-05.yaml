summary: >-
  Called the new policy lay and national and said its principles are understood and upheld by Kemal, against
  the Caliph's protest.
quote:
  text: En revanche, ces principes sont compris et maintenus par Moustapha Kemal pacha.
  language: fr
  translation: By contrast, these principles are understood and upheld by Mustapha Kemal Pasha.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Front page, in the leader 'Bulletin du jour: La suppression du khalifat', dated Paris, 4 March. The
  principles are 'les principes mêmes sur lesquels repose l'Etat turc', which, the leader says, those who lean
  on foreign influence, as the ex-caliph seems to have done, 'méconnaissent complètement'. It goes on to quote
  Kemal's Smyrna speech of 22 February on the army, and calls Turkey's present course an 'évolution qui a pour
  double but de rendre au peuple turc la plénitude de ses qualités originelles et d'ouvrir son esprit aux
  progrès de l'Occident'. The 'on va trop loin' of the same leader is its own answer to London reports that
  the abolition angers Indian Muslims.
node: Paris Dailies and the Abolition of the Caliphate, March 1924

summary: >-
  Explained Kemal's reasoning as a modern Turkey cut from every tie with the past, 'a thirst for isolation', and called the abolition a religious suicide.
quote:
  text: >-
    Le raisonnement de Mustapha Kemal pacha et de ses partisans est des plus simples. Ils veulent faire de la
    Turquie une nation moderne et européenne, entièrement indépendante des grandes puissances occidentales,
    indépendante des autres puissances de l'Islam, et détachée de tous liens avec l'ancienne Turquie des
    sultans.
  language: fr
  translation: >-
    The reasoning of Mustapha Kemal Pasha and his followers is of the simplest. They want to make Turkey a
    modern and European nation, entirely independent of the great Western powers, independent of the other
    Islamic powers, and detached from every tie with the old Turkey of the sultans.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 1, columns 1-2, 'L'abolition du califat et la politique musulmane de la France', signed Marcel Ray
  (masthead: no. 22 329, Wednesday 5 March 1924). The article goes on: 'la jeune république turque ne pense
  qu'à couper tous les liens avec le passé et montre comme une soif d'isolement', and says 'Mustapha Kemal et
  la Grande Assemblée n'avaient pas osé bouleverser d'un seul coup toutes les traditions et les institutions
  ottomanes' before abolishing the caliphate; of the Turks' 'espèce de suicide religieux' it says it does not
  seem to harm France, since it checks pan-Islamic propaganda.

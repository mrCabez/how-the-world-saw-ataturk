quote:
  text: >-
    Le discours prononcé par Mustapha Kemal, samedi dernier, n'était que le prélude des décisions importantes
    que vient d'adopter l'Assemblée nationale turque.
  language: fr
  translation: >-
    The speech delivered by Mustapha Kemal last Saturday was only the prelude to the important decisions which
    the Turkish National Assembly has just adopted.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 3, the opening sentence of 'Après la suppression du Califat', a commentary signed 'G. V.' in the
  foreign news. It lists what is already done (the caliph deposed, the caliphate abolished, the dynasty
  banished, the palaces turned into museums) and goes on: 'On voit combien profonde sont les dernières
  réformes introduites dans l'ancienne Turquie par le kemalisme victorieux.' The sentence quoted is reporting;
  the piece as a whole reads the reforms as the work of military chiefs set on freeing their country from the
  Western powers.

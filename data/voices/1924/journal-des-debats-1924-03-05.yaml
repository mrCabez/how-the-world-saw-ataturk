summary: >-
  Called him Kémal the Victorious, who controlled the elections and lived in Western fashion, and doubted the
  new secular laws could be applied.
quote:
  text: >-
    De nouvelles élections générales, effectuées sous le contrôle le plus strict de Moustafa Kémal le
    Victorieux, éliminèrent de la G. A. N. T. la plupart des hodjas et amenèrent des partisans du régime
    laïque.
  language: fr
  translation: >-
    New general elections, held under the strictest control of Moustafa Kémal the Victorious, eliminated most
    of the hodjas from the Grand National Assembly and brought in supporters of the secular regime.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 1, columns 3-4, 'La Turquie laïque', signed Auguste Gauvain (masthead: 136th year, no. 64, Wednesday 5
  March 1924). The next sentences: 'Moustafa Kémal vivait à l'occidentale, et sa jeune femme se libérait des
  voiles des femmes turques.' Gauvain's own judgement: the decisions 'cadrent avec l'esprit qui a dirigé les
  négociateurs turcs du traité de Lausanne' but are 'd'une application si difficile … qu'on se demande si
  elles sont réalisables'; he notes they 'consomment la ruine de nos écoles'. The sentence that Kemal 'aurait
  voulu qu'on ne bannît pas les membres de la famille impériale' is not Gauvain's: it is in a separate
  unsigned news item in column 6 of the same page, 'L'abolition du califat et le bannissement de la famille
  impériale turque', which the earlier record merged with this article.

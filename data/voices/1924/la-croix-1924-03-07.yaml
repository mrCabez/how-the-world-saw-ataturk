summary: >-
  Rejected the claim that Kemal spares Christian schools, attacked Turkish nationalist sectarian policy and Le
  Temps for applauding its secularism.
quote:
  text: >-
    Et, puisque Mustapha Kemal prétend inaugurer chez lui un régime moderne, ne pourrait-on pas lui rappeler
    que la liberté religieuse, et, avec elle, la liberté de la propagande, est l'un des principes qu'aime à
    invoquer notre société moderne ?
  language: fr
  translation: >-
    And since Mustapha Kemal claims to inaugurate a modern regime at home, could one not remind him that
    religious freedom, and with it freedom of propaganda, is one of the principles our modern society likes to
    invoke?
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 1, columns 2-3, 'L'intolérance turque (deuxième article)', signed Jean Guiraud (masthead: 45th year,
  no. 12 570, Friday 7 March 1924). Stronger, in column 3: 'Le gouvernement va-t-il laisser détruire ainsi
  l'œuvre de plusieurs siècles sous les coups du fanatisme maçonnique et nationaliste de Mustapha Kemal ?'
  and, in column 2, 'Mustapha Kemal ne ferme pas les écoles chrétiennes, disent-ils, il se contente de leur
  interdire d'être chrétiennes.' The phrase 'cette intolérance jeune-turque' is about the Young Turks, with
  Barrès. Replaces the withdrawn 9 March record (the quote was in this 7 March issue).

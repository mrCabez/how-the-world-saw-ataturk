  text: >-
    لقد كان يمكن أن يكتفي مصطفى كمال في مسألة الخلافة بالنحو الوسط الذي كان قائما لعهد جلالة الخليفة عبد المجيد
  language: ar
  translation: >-
    Mustafa Kemal could have been content, on the caliphate question, with the middle way that stood in the
    days of the Caliph Abdülmecid
  translated_by: "machine: research agent"
mediated_by: al-Akhbar (Cairo), articles from 6 Mar 1924, as quoted in al-Manar 25(4) p. 290
caveat: >-
  Mediated by Rida's reprint; which of the three al-Akhbar articles is quoted is unknown. Quote is the note
  author's English translation of the Arabic original, which the note prints. The Arabic is as printed,
  without the hamzas the typesetter left out; read on the scan (archive.org Almanar, almanar25.pdf (al-Manar
  vol. 25 part 4), PDF p. 215, printed p. 290; Rida's introduction on PDF p. 214 = printed p. 289; part
  masthead PDF p. 181 = printed p. 241); date as printed: al-Manar 25(4) masthead, p. 241: '٣٠ رمضان ١٣٤٢ — ١٤
  الثور ١٣٣٠ ه ش — ٤ مايو ١٩٢٤' (30 Ramadan 1342 / 4 May 1924; the solar-hijri year is printed ١٣٣٠). The
  al-Akhbar issue as given on p. 289: 'صدر في ٣ رجب الموافق ٦ مارث' (3 Rajab / 6 March).. Rida (al-Manar
  25(4), dated 4 May 1924, p. 289) presents the passage as following the opening of the first of the three
  al-Akhbar articles; he dates that al-Akhbar issue '٣ رجب الموافق ٦ مارث' (6 March), which by the masthead's
  own calendar is not 3 Rajab.

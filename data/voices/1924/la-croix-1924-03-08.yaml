summary: >-
  Under 'Gazette', suggested Angora's abolition of the caliphate aimed at mosque property, misled by the French 'milliard des Congrégations'; Kemal is not named.
quote:
  text: >-
    Ceux qui leur ont parlé du fameux milliard des Congrégations de France ont sans doute omis de leur dire
    comment le milliard s'est évanoui et de leur raconter l'histoire du forçat Duez.
  language: fr
  translation: >-
    Those who told them of the famous billion of the Congregations of France no doubt forgot to tell them how
    the billion vanished, and to tell them the story of the convict Duez.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 1, column 3, rubric 'Gazette', item 'Le « milliard des Congrégations » en Turquie', unsigned (masthead:
  45th year, no. 12 571, Saturday 8 March 1924). Kemal is not named; the item speaks of 'le gouvernement
  d'Angora' and 'les radicaux d'Angora'. It opens: 'En abolissant le califat, le gouvernement d'Angora
  n'aurait-il pas en vue la liquidation des biens religieux auxquels Abd-ul-Hamid et les premiers Jeunes Turcs
  eux-mêmes n'avaient pas osé toucher ?'. Hostile polarity is an inference from the framing.

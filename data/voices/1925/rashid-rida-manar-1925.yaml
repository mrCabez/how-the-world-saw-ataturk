summary: >-
  Called Ankara's open backing for a Turkish Qur'an a scheme of its 'heretics' to draw believers away from the
  Arabic word of God.
quote:
  text: >-
    وكانت توجهت فكرة ملاحدتهم الى هذا العمل منذ سنين كثيرة لاجل صرف أهل الدين منهم بالترجمة التركية التى هي من
    كلامهم وتأليفهم ونظامهم عن كلام الله تعالى
  language: ar
  translation: >-
    The thinking of their heretics had turned to this work many years ago, in order to turn the religious
    among them, by a Turkish translation that is of their own words, composition and arrangement, away from
    the word of God Most High
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  al-Manar vol. 25, part 10, p. 794, under the heading 'ترجمة القرآن وتحريف ترجمة له والتشكيك فيه' (The
  translation of the Qur'an, the distortion of a translation of it, and the casting of doubt on it). The
  sentence before says what 'this work' is: 'مجاهرة الحكومة التركية الانقروية بالمساعدة على ترجمة القرآن
  الكريم ونشرها باللغة التركية' (the Turkish government at Ankara openly helping to translate the Noble Qur'an
  and to publish it in Turkish), the first of three events he calls the most important for the Muslim world.
  He speaks of the Ankara government and its 'heretics' and does not name Kemal. The title page of the part is
  dated 30 Sha'ban 1343 / 25 March 1925. Wilson 2009 (IJMES 41), whose epigraph has 'their heretical idea'
  where the Arabic has 'فكرة ملاحدتهم', cites the page under the volume's year, 1924, and this record did the
  same until the page was read. Wilson shows Kemal had no hand in the translations; Rida's reading was
  mistaken. In the archive.org PDF the page is no. 599.

summary: >-
  Read Kemal's victory as a possible blow at British imperialism in Asia, through the Arabs or Afghanistan.
quote:
  text: >-
    Kemal peut cependant atteindre l'impérialisme britannique en Asie, — soit qu'il se concerte avec les
    Arabes de Mésopotamie et de Palestine — accord chimérique hier, sans doute réalisable aujourd'hui, — soit
    qu'il exploite en Afghanistan et dans l'Inde le sursaut de l'islamisme.
  language: fr
  translation: >-
    Kemal can nevertheless strike British imperialism in Asia, either by coming to terms with the Arabs of
    Mesopotamia and Palestine, an agreement that was a chimera yesterday and is no doubt feasible today, or by
    exploiting the revival of Islamism in Afghanistan and India.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 3, column 1, 'Nouvelles internationales', overline 'L'Angleterre en face des Turcs', headline 'Les
  conséquences mondiales du conflit', signed Paul Louis (masthead: no. 6743, Monday 11 September 1922). The
  printer doubled a syllable at the line end ('ac-/accord'); the quote has 'accord'. The article opens:
  'L'Angleterre de Lloyd George, de Curzon, des grands financiers, des grands pétroliers et le kemalisme —
  c'est-à-dire la Turquie réveillée — sont face à face', and says the nationalists reconquered Asia Minor
  'avec une rapidité prodigieuse'.

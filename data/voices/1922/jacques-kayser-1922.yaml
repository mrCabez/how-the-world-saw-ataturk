summary: >-
  Presented Kemal as a pragmatist made by the Treaty of Sèvres, who took Soviet help but kept Moscow's
  propagandists out; no reproach due.
quote:
  text: On aurait tort de reprocher à Mustapha Kemal son attitude en cette occasion.
  language: fr
  translation: One would be wrong to reproach Mustapha Kemal for his attitude on this occasion.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Jacques Kayser, L'Europe et la Turquie nouvelle (Paris: Les Presses universitaires de France, 1922;
  legal-deposit stamp 1923), printed p. 94 (Gallica view 106). The 'occasion' is the treaty of alliance with
  Moscow; the sentence goes on: 'Aux prises avec un ennemi acharné, il fut contraint par les nécessités
  vitales de sa patrie d'accepter l'aide de tous les défenseurs qui s'offraient. Il a saisi l'occasion russe
  en réussissant à ne se lier en aucune façon.' P. 93: 'il a interdit l'accès de son territoire aux
  propagandistes de Moscou'. The Sèvres passages (views 64, 82) were not re-read.

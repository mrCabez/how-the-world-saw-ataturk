evidence: P
summary: >-
  All the East calls Kemal a great man; he grants him success, and says entering Constantinople will first
  show whether it is bubble or greatness.
quote:
  text: >-
    All the East says that Mustapha Kemal Pasha is a great man. At least he is a successful man, but his entry
    into Constantinople will be the first indication of whether his fame is to be merely the bubble of
    military reputation, always burst by the first defeat, or the greatness of a man who can deal with the
    problems his victory has brought him.
  language: en
mediated_by: "Reprint in Hemingway, Dateline: Toronto (Scribner's, 1985), read in a web copy of the book"
caveat: >-
  The closing paragraphs of 'Waiting for an Orgy', Toronto Daily Star, 19 October 1922 (in the paper:
  'Constantinople Cut-Throats Await Chance for an Orgy'). Just before the quote: 'I would hate to be Kemal
  with all the dangerous prestige of a great victory behind me and these problems ahead.' Just after, ending
  the dispatch: 'The cards look stacked against him in Constantinople, but if he can accomplish a peaceful
  entry, keep his troops in hand, and see there is no reign of terror, it will be of greater permanent value
  to Turkey than many victories in Thrace.' A later scholar quotes the first sentence without 'Pasha', with a
  page number from another edition; in Scribner's 1985 edition the dispatch is on pp. 230-31. The Toronto
  Daily Star itself was not seen.
node: Hemingway Reads Kemal, Toronto Star October 1922

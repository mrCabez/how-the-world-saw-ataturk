summary: >-
  The Muslim world's new Saladin has turned businessman, taking gains and compromising; the East begins to
  distrust him, and war over Mesopotamia's oil may follow.
quote:
  text: >-
    Mustapha Kemal Pasha a few months ago was regarded as a new Saladin by the Moslem world. … Now the East is
    beginning to distrust him. … This has happened because Kemal, the conquering general, has shown himself to
    be Kemal the businessman.
  language: en
mediated_by: "Reprint in Hemingway, Dateline: Toronto (Scribner's, 1985), read in a web copy of the book"
caveat: >-
  The opening of 'Turks Distrust Kemal Pasha', Toronto Daily Star, 24 October 1922 (in the paper: 'Turks
  Beginning to Show Distrust of Kemal Pasha'), after the dateline 'CONSTANTINOPLE.—'. The admiration and the
  distrust in the quote are the Muslim world's, as he reports them; 'Kemal the businessman' is his own
  reading. The words left out at the two marks: 'He was to lead Islam into battle against Christianity and to
  spread a holy war through all the East.' and 'Mohammedans I have talked to say: “Kemal has betrayed us.”
  There is no talk now of the holy war.' He likens Kemal's position to that of Griffith and Collins in
  Ireland, taking the tangible gains and planning to try for more. He passes on, as gossip, that many of the
  Kemalist leaders are said to be atheists and French Freemasons. Of a rumour that Kemal is of Jewish origin
  he says it gains very little credence, though he adds that his face 'does look Jewish'. He gives Kemal
  twenty months before a war with Britain over Mesopotamia and its oil. The Toronto Daily Star itself was not
  seen.
node: Hemingway Reads Kemal, Toronto Star October 1922

summary: >-
  On Clifford Sifton's orders opposed sending troops; the Turk served as pretext for Canadian independence,
  not an object of interest.
quote:
  text: the policy of the Free Press must be one of opposition to sending troops
  language: en
mediated_by: >-
  Ramsay Cook (ed.), The Dafoe-Sifton Correspondence 1919-1927 (1966), quoted in C. P. Stacey, Canada and the

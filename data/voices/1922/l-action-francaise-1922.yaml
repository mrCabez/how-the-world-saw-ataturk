caveat: >-
  Page 1, last column, 'La paix tardive de l'Orient', signed J. B. (masthead: no. 259, Saturday 16 September
  1922). The article says the Turks do not seem unreasonable or intent on attacking the neutral zone (the
  paper spells 'Fehti bey'), dismisses the Balkan scare reported by the English press as 'déjà calmée si elle
  n'a pas été inventée', and asks: 'puisque la Turquie n'est pas détruite et que personne ne se charge d'aller
  la tuer à Angora, ne vaut-il pas mieux s'accommoder de son existence ?'. It is not a Balkan war-scare
  column, as the earlier record said.

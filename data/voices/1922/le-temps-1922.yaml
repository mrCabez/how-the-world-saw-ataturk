summary: >-
  Reported that Kemal decreed death for soldiers committing excesses and was ready for a peace conference,
  alongside the burning of Smyrna.
quote:
  text: >-
    Moustapha Kemal se déclara prêt à participer à une conférence de paix; mais si elle n'a pas lieu en
    territoire turc, il ne sera pas autorisé par le gouvernement d'Angora à s'y rendre.
  language: fr
  translation: >-
    Moustapha Kemal declared himself ready to take part in a peace conference; but if it is not held on
    Turkish territory, he will not be authorised by the Angora government to attend.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Both passages are on page 2 of the issue of 16 September 1922 (no. 22321). The peace-conference sentence is
  the paper's unsigned summary of Kemal's interview with Ward Price of the Daily Mail, in the section 'Les
  conditions de paix de la Turquie / Déclarations de Moustapha Kemal', which also prints him directly ('Il n'y
  a plus de raisons de se battre. Je désire sincèrement la paix.'; 'Nous ne voulons pas d'actes de vengeance …
  pour nous, le passé est le passé'). The death-penalty sentence ('Kemal pacha a édicté la peine de mort
  contre tous les soldats qui commettraient des excès. Cet ordre sera respecté.') is from the paper's special
  correspondent in Berlin, relaying the Angora minister of posts, Sabri bey. The burning of Smyrna is on p. 1
  ('Smyrne en feu', 'Smyrne brûle depuis douze heures'); Kemal is not named in those dispatches. Neither
  passage was found in the 17 September issue.

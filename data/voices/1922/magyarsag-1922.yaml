summary: >-
  Said Kemal drove the Greeks out; 'The Sick Man' and 'The Rising Crescent' leaders; asked if Hungary's own
  Mustafa Kemal would emerge.
quote:
  text: >-
    Acaba ne zaman uyanırlar, barışın kutsallıkları ile Orta Avrupanın Hasta Adamları? Acaba zamanın arı
    kovanından bizim Mustafa Kemalimiz çıkacak mı?
  language: tr
  translation: >-
    When, one wonders, will they wake, the Sick Men of Central Europe, with their sanctities of the peace?
    Will our own Mustafa Kemal, one wonders, come out of the beehive of time?
  translated_by: "machine: claude-fable-5-2"
  is_translation: true
mediated_by: Rásonyi, Belleten XLV, pp. 79–86 (Turkish renderings of the Hungarian)
caveat: >-
  Hungarian self-projection is the note's reading ('evidently'). The Turkish is as the article prints it (p.
  83); it is the Turkish press's rendering of the paper's words. The English before 16 Nov 2026 was a
  shortened paraphrase of it.
node: Magyarság Reads the Victory, 1920–1923

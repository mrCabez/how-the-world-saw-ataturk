summary: >-
  Warned that if Kemal and Fehrid Bey follow Moscow's counsel a new conflict would spread through the Balkans
  and central Europe.
quote:
  text: >-
    Que Fehrid bey et Mustapha Kemal écoutent certains conseils qui leur viennent de Moscou, un nouveau
    conflit s'ensuivra dans les Balkans, et toute une partie de l'Europe centrale y sera entraînée !
  language: fr
  translation: >-
    If Fehrid Bey and Mustapha Kemal listen to certain counsels that reach them from Moscow, a new conflict
    will follow in the Balkans, and a whole part of central Europe will be drawn into it!
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 1, column 4, overline 'Le problème du Proche-Orient', headline 'Conséquences de la victoire turque',
  signed S. Grumbach (masthead: 7th year, no. 720, Monday 11 September 1922); the sentence is set in italics.
  The printed words are 'Kemal' and 'écoutent'; the earlier OCR read 'Kernal' and 'écoulent'. A warning, not a
  condemnation. The article calls French rejoicing at the Turkish success 'puéril', says Angora nationalism
  'implique également de graves dangers pour la paix', and ends that internationalising the Dardanelles would
  serve world stability better than 'le retour d'une domination purement turque'.
node: Paris Dailies on Kemal's Victory, 11–17 September 1922

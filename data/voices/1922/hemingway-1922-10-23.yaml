summary: >-
  Says Kemal was, broadly speaking, for sale and the French bought him; his win over worn-out Greek conscripts
  is overrated.
quote:
  text: >-
    About two years ago Mustapha Kemal Pasha was denounced by the Earl of Balfour as a common bandit. He was,
    speaking in the broadest sense, for sale to the highest bidder. The French bought him.
  language: en
mediated_by: "Reprint in Hemingway, Dateline: Toronto (Scribner's, 1985), read in a web copy of the book"
caveat: >-
  From 'Russia Spoiling the French Game', Toronto Daily Star, 23 October 1922, which opens with the meeting at
  Mudania. 'Common bandit' is Balfour's phrase as Hemingway reports it; 'for sale' and 'bought' are his own,
  hedged with 'speaking in the broadest sense'. The oil concessions France got in return are given as rumour
  ('it is rumored'). On the victory: 'Kemal whipped the Greeks, as everyone knows. But when you realize that
  he was fighting a conscript army ... it was not the magnificent military achievement that it is made out to
  be.' He expects Kemal's ties with Soviet Russia to bring him into difficulties with France. A young
  reporter's reading of great-power politics, not a documented account of French dealings. The Toronto Daily
  Star itself was not seen.
node: Hemingway Reads Kemal, Toronto Star October 1922

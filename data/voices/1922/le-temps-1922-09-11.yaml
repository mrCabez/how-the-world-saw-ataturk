summary: >-
  In a bracketed note under a London dispatch, answered the Evening Standard that Kemal and his officers are not 'uncultured peasants', citing Townshend.
quote:
  text: >-
    [On pourrait répondre aux insinuations de l'Evening Standard que Moustapha Kemal et ses officiers
    d'état-major ne sont pas des « paysans incultes », comme en a témoigné tout récemment dans une interview
    le général anglais Townshend, à son retour d'Angora.
  language: fr
  translation: >-
    [One could answer the Evening Standard's insinuations that Moustapha Kemal and his staff officers are not
    'uncultured peasants', as General Townshend recently testified in an interview on his return from Angora.
  translated_by: "machine: claude-fable-5-2"
  note: The sentence opens a note in square brackets that the paper adds to a dispatch.
caveat: >-
  Page 1, column 6, rubric 'Proche-Orient / Le conflit gréco-turc', item 'Une insinuation anglaise contre la
  France', 'On mande de Londres' (masthead: no. 22316, Monday 11 September 1922). The sentence is the paper's
  own comment in square brackets, unsigned, after the Evening Standard's note; it is not in the 'Bulletin du
  jour', so the artifact is an article, not an editorial. The bracket runs on: 'Le général Townshend … a jeté
  une pleine lumière sur le remarquable effort industriel d'Angora et sur les capacités stratégiques des chefs
  de l'armée ottomane.' The leading article of the same page begins: 'En quinze jours, par une offensive
  foudroyante, les troupes de Kemal pacha ont donc atteint leur but'.
node: Paris Dailies on Kemal's Victory, 11–17 September 1922

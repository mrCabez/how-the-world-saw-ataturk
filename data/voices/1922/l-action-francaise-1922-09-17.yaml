summary: >-
  Remarked that Kemal, wanting the armistice request to come from the Greek commander, is wary and right: 'a man who knows how to will'.
quote:
  text: Moustapha Kémal se méfie et il a raison.
  language: fr
  translation: Moustapha Kémal is wary, and he is right.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 3 (masthead: no. 260, Sunday 17 September 1922), 'Revue de la presse', section 'La maladie de la
  volonté', continued on p. 4 and signed Robert Havard de la Montagne. The paper reviews Eugène Lautier in
  L'Homme libre. The sentence is set in the reviewer's own type, with no quotation marks, so it is the
  reviewer's comment or his condensing of Lautier's conclusion; which of the two the type does not settle.
  Context: Kemal says that before negotiating with the Greeks he would prefer an armistice request from the
  Greek commander-in-chief to the Allied powers' intervention, which Lautier sets against France's armistice
  of November 1918. The review ends: 'Voilà un homme qui sait vouloir...'. (The printed 'se méfie' and
  'raison' were OCR-damaged in the earlier record; the neutral-zone context it described is not in the print.)

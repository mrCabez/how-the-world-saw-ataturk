summary: >-
  Mocked the Angora constitution as Levantine acrobatics and Kemal as having confiscated all powers, yet cast
  him as Islam's modern Saladin-type standard-bearer.
quote:
  text: >-
    Pour simplifier le système démontable à volonté que constitue cette machine improvisée, Mustapha Kemal a
    confisqué tous les pouvoirs qu'il a partagés avec ses lieutenants.
  language: fr
  translation: >-
    To simplify the system, which can be taken apart at will, that this improvised machine constitutes,
    Mustapha Kemal has confiscated all the powers, which he has shared with his lieutenants.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Bertrand Bareilles, Le drame oriental d'Athènes à Angora (Bossard, 1923), printed p. 194 (view 196), running
  on to p. 195. P. 195 goes on: 'Cette combinaison montre à quel point est normal en pays d'Orient le
  gouvernement despotique et combien la livrée dont on a cru devoir l'affubler trahit le clinquant.' The
  'acrobatie levantine' and Saladin passages (views 193, 198) were not re-read; polarity is hostile-leaning,
  arguably conflicted.

quote:
  text: >-
    Atatürk'ü şahsen tanımakla bahtiyarım. Kendisine derin bir hürmetim vardır. Ben Ankara'da olduğum zaman
    daima güneşe bakardım. Fakat ben güneşi ufukta değil, Çankaya'da görürdüm. Çünkü hakiki güneş Çankaya'daki
    Atatürk denilen güneşti. Atatürk'ün kaybı yalnız Türkiye için değil, bütün dünya için büyük bir kayıptı
  language: tr
  translation: >-
    I am fortunate to have known Atatürk personally. I have a deep respect for him. When I was in Ankara I
    always used to look at the sun. But I did not see the sun on the horizon; I saw it in Çankaya. For the
    true sun was the sun called Atatürk in Çankaya. Atatürk's loss was a great loss not only for Turkey but
    for the whole world.
  translated_by: "machine: claude-fable-5-2"
  is_translation: true

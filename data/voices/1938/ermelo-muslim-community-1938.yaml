voice: Muslim community of Ermelo
voice_type: collective
role: Muslim community in the Transvaal, South Africa
country: South Africa
country_now: South Africa
domain: religion
date: "1938-11-11"
era: funeral
polarity: admiring
intensity: 1
artifact: telegram
evidence: P
summary: >-
  Sent heartfelt sympathy on the death of 'their greatest reformers' and one of 'the ablest statesmen', and
  asked God to bless his soul.
quote:
  text: their greatest reformers and one of the ablest statesmen
  language: en
caveat: >-
  Radio telegram from Ermelo, Transvaal, handed in 11/11/38 15:35, to the president of the Turkish National
  Assembly (vol. II, PDF p. 31, sheet 29). The form is typed in lower case: 'muslim community of ermelo
  transvaal wishes to convey their heartfelt sympathy in the death of their greatest reformers and one of the
  ablest statesmen kamal ataturk may allah bless his soul = muslim community'. The sentence takes 'their
  greatest reformers' as plural; the form says so. A margin note says the addressee is probably Abdülhalik
  Renda and that the telegram is filed in Istanbul. It is a separate telegram from the Transvaal Muslim
  Association's of the same days (transvaal-muslim-association-1938).
node: Condolence Telegrams to Ankara, November 1938

summary: >-
  The man who drove out sultans and shattered armies, greatest enemy of tyranny, founder of the eternal regime
  of Kemalism, has died.
quote:
  text: >-
    Sultanları kovan, orduları tarumar eden, Çanakkale kahramanı, Sakarya’nın yaratıcısı Mustafa Kemal öldü.
    Türkiye’yi yoktan var eden, onu en kuvvetli devletler mertebesine çıkaran, vatanı kölelikten hürriyete,
    zilletten şerefe götüren Atatürk öldü. Zulmün en büyük düşmanı, ebedi Kemalizm rejiminin kurucusu öldü.
  language: tr
  translation: >-
    Mustafa Kemal, who drove out the sultans and shattered the armies, the hero of Çanakkale, the creator of
    Sakarya, is dead. Atatürk, who made Turkey out of nothing, raised it to the rank of the strongest states,
    and led the homeland from slavery to freedom, from abasement to honour, is dead. The greatest enemy of
    tyranny, the founder of the eternal regime of Kemalism, is dead.
  translated_by: "machine: claude-fable-5-2"
  is_translation: true

date: "1938-11-11"
era: funeral
polarity: admiring
intensity: 1
artifact: telegram
evidence: P
summary: >-
  Cabled from Paris that Azerbaijan, groaning under foreign rule, cannot even mourn him freely; the memory of
  the great chief will live in Azeri hearts.
quote:
  text: bu gün yabancı hükmü altında inleyen Azerbaycan
  language: tr
  translation: Azerbaijan, groaning today under foreign rule
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Radio telegram from Paris, 11/11 13:12, signed 'mir yakub azerbaycan milli heyet reisi' (vol. II, PDF p. 51,
  sheet 48). Typed in lower case, mostly without Turkish letters and with slips ('tazuyetlerimizi',
  'saferlerle'); the quote gives its words in ordinary spelling. Of him it says: 'ulu sefin tukenmez
  saferlerle dolu hatiralari kalplerimizde ebediyyen yaşayacaktir' (the memories of the great chief, full of
  victories without end, will live for ever in our hearts). The quoted clause goes on: 'bu en buyuk mateme
  butun varligile istirake hazirlanirken malum vahsi penceleri onunde elim acilerini bile doya doya duymak
  imkansizligi karsisinda bulunuyor' (as it makes ready to join in this greatest of mournings with its whole
  being, it finds that before the well-known savage claws it cannot even feel its bitter grief to the full).

summary: >-
  Attended the Ankara funeral for the Spanish Republic, with a general and two admirals, after the cabinet
  decided on 18 November to send a commission.
mediated_by: Tüylü Turan 2019, pp. 193-194 ← Justicia Social, 22 Nov 1938, p. 2; CNT, 23 Nov 1938, p. 2
caveat: >-
  The date is that of the cabinet's decision; the funeral was on 21 November. Whether Franco's Burgos sent
  anyone is not established. The Spanish papers also made fun of a Sunday Times report that the delegation's
  aeroplane had crashed at Malta (La Voz de Menorca, 23 Nov 1938).

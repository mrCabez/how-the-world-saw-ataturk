  text: >-
    En quinze ans, des siècles ont été franchis, tout cela par la volonté d'un homme qui avait déjà libéré son
    pays du joug étranger.
  language: fr
  translation: >-
    In fifteen years, centuries were crossed, all of it by the will of a man who had already freed his country
    from the foreign yoke.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Signed 'Louis Réville'. Headed 'Mort de Kemal Ataturk', under the Istanbul telegram of the morning of 10
  November, with the sections 'La carrière du défunt', 'De Samsoun à Ankara', 'La déchéance du sultan et la
  proclamation de la République' and 'L'œuvre de quinze ans de république'. It opens: 'Celui qui fut l'artisan
  de la Turquie nouvelle n'est plus. Tout un peuple pleure le chef vénéré, libérateur du territoire et artisan
  des réformes qui ont transformé le pays.' It closes: 'Leader de l'Entente balkanique, promotrice du pacte
  oriental, la Turquie a marqué sa place dans le monde et les compagnons du grand chef sauront maintenir le
  prestige du pays.' The same article notes nights of receptions 'où le champagne succédait au whisky et au
  raki national'.

quote:
  text: Kardeş Türkiye'nin büyük matemine Milli Azerbaycan adına candan teessürle iştirak ederim
  language: tr
  translation: >-
    In the name of National Azerbaijan I share, with heartfelt sorrow, in the great mourning of brotherly

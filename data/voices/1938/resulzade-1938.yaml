  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Radio telegram from Warsaw (address Kielecka 36), handed in on the 10th at 17:21 and postmarked Ankara
  10-11-1938, the day he died. The form prints it in capitals without Turkish letters: 'KARDES TURKIYENIN
  BUYUK MATEMINE MILLI AZERBAYCAN ADINA CANDAN TEESSURLE ISTIRAK EDERIM = MEHMET EMIN RESULZADE'. No stated
  view beyond mourning. His article of the same month is a separate record (mehmed-emin-resulzade-1938).

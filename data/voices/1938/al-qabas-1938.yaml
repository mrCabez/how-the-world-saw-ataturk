summary: Syrians share the grief; the best consolation is to follow the road the great genius drew.
quote:
  text: >-
    Türk vatanının yapıcısı, Türk şefkat ve azametinin yaratıcısı, insaniyetin en büyük hadimi Atatürk’ün
    ölümü ile Türk milletinin duyduğu kedere Suriyeliler bütün kalpleriyle iştirak ederler. Kardeş milletin
    uğradığı bu acı karşısında bizim en büyük tesellimiz büyük dâhinin çizdiği yolu takip etmektir
  language: tr
  translation: >-
    The Syrians share with all their hearts the grief the Turkish nation feels at the death of Atatürk,
    builder of the Turkish homeland, creator of Turkish compassion and grandeur, humanity’s greatest servant.
    Our greatest consolation before this pain that has struck the brother nation is to follow the road the
    great genius drew.
  translated_by: "machine: claude-fable-5-2"
  is_translation: true

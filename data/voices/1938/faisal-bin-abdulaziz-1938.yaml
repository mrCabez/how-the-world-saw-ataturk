summary: >-
  Cabled the Turkish foreign ministry that the Saudis learned of Atatürk's death with great regret, and called
  it a great loss.
quote:
  text: >-
    It is with great regret that we learned of the death of the President of Turkey, Kemal Atatürk. It is a
    great loss.
  language: en
caveat: >-
  The wording is the English of the Gulf International Forum article that quotes the telegram; the article
  does not say in which language it was sent, and the archive has not seen the telegram itself. A two-sentence
  message of condolence from one foreign ministry to another, in a relationship the same article describes as
  pragmatic.

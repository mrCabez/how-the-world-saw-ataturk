summary: >-
  Freed Turkey from caliphate and British designs and kept Soviet friendship, yet repressed socialists and
  communists; his death might open Turkey to Hitler.
quote:
  text: >-
    Disons cependant que le gouvernement d'Ataturk exerça une répression féroce contre le mouvement socialiste
    et communiste.
  language: fr
  translation: >-
    Let us say, however, that Atatürk's government carried out a ferocious repression of the socialist and
    communist movement.
  translated_by: "machine: claude-fable-5-2"
caveat: >-
  Page 3, top right, 'Kemal Ataturk est mort hier', dateline 'Istamboul, 10 novembre', unsigned, in the issue
  of 11 November 1938 (no. 14.571). The 'libéra la Turquie du joug du califat et des visées anglaises, et dont
  la disparition peut favoriser la poussée hitlérienne' wording is the caption of a caricature on page 1; the
  'répression féroce' sentence is on page 3, followed by: 'ne va-t-elle pas permettre à la réaction turque de
  laisser s'accentuer la pénétration hitlérienne en Proche-Orient ?'.

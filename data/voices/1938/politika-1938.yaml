summary: >-
  Said history will inscribe his name; a man of the people whose will and intellect made him transformer of
  the new Turkey.
quote:
  text: >-
    Kırılmaz azmi, kuvvetli zekâsı ve kuvveti kendisini mağlup ettiği mukadderatın önüne getirmiş ve bu
    suretle yeni Türkiye’nin mübadili olmuştur
  language: tr
  translation: >-
    His unbreakable determination, his strong mind and his strength brought him before the destiny he had
    defeated, and so he became the “mübadil” of the new Turkey.
  translated_by: "machine: claude-fable-5-2"
  note: >-
    'mübadil' is as Toksoy prints it; it means one exchanged, a substitute, so it is probably a slip for
    'creator' or 'changer'. The Serbian original was not seen.

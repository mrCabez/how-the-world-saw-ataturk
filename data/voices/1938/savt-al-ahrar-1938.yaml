caveat: >-
  Quotes reach us through Turkish dailies' translations; paper-title transliterations are conjectural. The
  article reports this in indirect speech (p. 200, fn 97: 'Yine Beyrut-Savtulahrar gazetesi ise, Atatürk’ün
  hayatı için sayfalar ayırmış ve Tük milletinin üzüntüsünü paylaşan cümlelerle taziyelerini sunduktan sonra
  Atatürk’ün ölümünün bütün şark milletleri için de en büyük kayıp olduğunu yazmıştır 97.'), so there are no
  words of the paper's to quote; until 16 Nov 2026 the record carried an English rendering of that sentence as
  a quote.

voice: Albert Sarraut
voice_type: person
role: French Interior Minister, head of funeral delegation
country: France
country_now: France
domain: diplomacy
date: "1938-11-18"
era: funeral
polarity: admiring
intensity: 2
artifact: visit
evidence: P+S
summary: >-
  Led France's funeral delegation; a former ambassador in Ankara, he told the Turkish press on arriving that
  Atatürk had had his 'deep admiration' ever since.
quote:
  text: >-
    Türkiye’de sefir bulunduğum müddet içinde itimat ve dostluk hisleriyle beni taltif eden Atatürk’e o
    zamandan beri derin hayranlığım vardır.
  language: tr
  translation: >-
    Atatürk, who honoured me with feelings of trust and friendship while I was ambassador in Turkey, has had
    my deep admiration ever since.
  translated_by: "machine: claude-opus-5-5"
  is_translation: true
mediated_by: >-
  Toksoy 2006 ← Akşam 20 Nov 1938 p. 3 (arrival statement); Tüylü Turan 2019 (Spanish press); Havas via Delpher
caveat: >-
  The quote is his statement on arriving for the funeral as Akşam printed it in Turkish (Toksoy 2006 p. 159,
  fn 59); it is the Turkish press's rendering of his words. Before 16 Nov 2026 the record quoted another
  sentence, 'Ona karşı hayranlık ve sevgi besliyordum' (I felt admiration and affection for him): that is from
  the article he wrote on Atatürk's death for Paris-Soir, as Akşam, Tan and Ulus printed it on 11–15 Nov (p.
  151, fn 26), not from the funeral visit. The 'courtship of Ankara' reading belongs to a Dutch daily, not to
  Sarraut. Tüylü Turan 2019 not read directly.

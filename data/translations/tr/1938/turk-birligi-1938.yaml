id: turk-birligi-1938
voice: Türk Birliği
role: Romanya Türk azınlığı gazetesi
quote: Türklük var oldukça eserlerin meydanda görülecek ve sen ölmeyeceksin Atatürk!
quote_kind: original-turkish
summary: Ardından yas tutan şiirler ve ağıtlar yayımladı (6 Aralık 1938 sayısı).
caveat: >-
  Toksoy bu sözleri 1938 tarihli bir Türk gazetesinden değil, 2005 tarihli bir sempozyum bildirisinden
  almaktadır; Türk Birliği bizzat Romanya'daki Türk topluluğunun Türkçe yayımlanan bir gazetesi olabilir ve bu
  durumda Türkçe metin özgün metindir (bu husus belirtilmemiştir). Toksoy ayrıca Romanya'daki Türk
  topluluğunun onu kendi lideri olarak gördüğünü söylemektedir (1939 tarihli kayıt), ancak bunu özellikle bu
  gazete için belirtmemektedir. Türkçe metin makalede basıldığı şekildedir (s. 191, dn. 66).
mediated_by: Toksoy 2010 (Rumence asılları görülmedi)
verification_note: >-

caveat: >-
  İmzasız Four Months in the Levant dizisinin yazarı görülen sayfalarda belirtilmemiştir. Alıntı, notta basılı
  olan Arapça özgün metnin not yazarı tarafından yapılan İngilizce çevirisidir. Arapça metin, dizgicinin
  atladığı hemzeler olmaksızın basıldığı gibidir; tarama üzerinden okunmuştur (archive.org
  efath-moheb-elden-elkheeb, 631_730_Efath_Moheb_Elden_Elkheeb.pdf, PDF s. 79, basılı s. 829 (sayı s. 7), sol
  sütun; makale başlığı PDF s. 78 = basılı s. 828; sonu ve imza PDF s. 80 = basılı s. 830; kapak PDF s. 73,
  künye PDF s. 75); basılı tarih: Kapak: 'العدد ٦٣٤ (العام الثالث عشر) — الخميس : ٧ ذو القعدة ١٣٥٧'; künye:
  '٦٣٤ (العام الثالث عشر) ... ٧ ذو القعدة ١٣٥٧' (sayı 634, 13. yıl, 7 Zilkade 1357 Perşembe). Miladi tarih
  basılı değildir.. Taramada makale s. 828'de başlamakta ve sonunda, s. 830'da, 'مصطفى حسنى السباعى' (Mustafa
  Hasani al-Siba'i) imzasını taşımaktadır; sayıda (sayı 634, 13. yıl) yalnızca Hicri 7 Zilkade 1357 tarihi
  basılıdır. Araştırma notunda 'الدعاية الكمالية' olarak geçen ifade, basılı metinde 'الدعاية للكماليين'
  (Kemalistler için propaganda) şeklindedir.

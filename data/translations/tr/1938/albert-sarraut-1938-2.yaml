voice: Albert Sarraut
role: Fransa İçişleri Bakanı, cenaze heyeti başkanı
quote: >-
  Türkiye’de sefir bulunduğum müddet içinde itimat ve dostluk hisleriyle beni taltif eden Atatürk’e o zamandan
  beri derin hayranlığım vardır.
quote_kind: original-turkish
summary: >-
  Fransa'nın cenaze heyetine başkanlık etti; eski bir Ankara büyükelçisi olarak, gelişinde Türk basınına o
  zamandan beri Atatürk'e 'derin bir hayranlık' duyduğunu söyledi.
caveat: >-
  Alıntı, cenaze için gelişinde yaptığı ve Akşam'ın Türkçe olarak bastığı açıklamasıdır (Toksoy 2006 s. 159,
  dn. 59); sözlerinin Türk basını tarafından aktarımıdır. 16 Kasım 2026'dan önce kayıtta başka bir cümle, 'Ona
  karşı hayranlık ve sevgi besliyordum' (I felt admiration and affection for him) alıntılanıyordu: bu cümle
  cenaze ziyaretinden değil, Atatürk'ün ölümü üzerine Paris-Soir için yazdığı ve Akşam, Tan ile Ulus'un 11–15
  Kasım'da bastığı makaledendir (s. 151, dn. 26). 'Ankara'ya kur yapma' ('courtship of Ankara') okuması
  Sarraut'ya değil, bir Hollanda gazetesine aittir. Tüylü Turan 2019 doğrudan okunmadı.

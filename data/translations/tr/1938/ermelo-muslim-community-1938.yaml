  notunda, muhatabın muhtemelen Abdülhalik Renda olduğu ve telgrafın İstanbul'da dosyalandığı
  belirtilmektedir. Aynı günlerde Transvaal Müslüman Cemiyeti tarafından gönderilen telgraftan
  (transvaal-muslim-association-1938) ayrı bir telgraftır.

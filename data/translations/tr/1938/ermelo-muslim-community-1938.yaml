summary: >-
  'En büyük reformcuları' ve 'en yetenekli devlet adamlarından biri'nin vefatı üzerine içten taziyelerini
  iletti ve Allah'tan ruhuna rahmet diledi.
caveat: >-
  Transvaal, Ermelo'dan Türkiye Büyük Millet Meclisi Başkanına gönderilen ve 11/11/38 saat 15:35'te teslim

id: noel-fiessinger-1938
voice: Noël Fiessinger
role: Parisli tıp profesörü; Atatürk'ün konsültan hekimi
quote: >-
  Atatürk, tıbbın müdahalesi ve tabiatın yardımıyla daha iki sene yaşayabilir. Tıp tarihinde bunun misalleri
  çoktur. Fakat şimdi yata döneriz, barsak veya beyin kanamasından Atatürk’ü ölmüş de bulabiliriz.
quote_kind: original-turkish
summary: >-
  1938'de Atatürk'ü defalarca muayene etti, ortaklaşa 'hepatite sclérocongestive éthylique' teşhisi koydu ve
  özel olarak iki yıl daha yaşayabileceği ya da herhangi bir gece ölebileceği uyarısında bulundu.
caveat: >-
  Haziran 1938'de, Savarona yatında Atatürk'ü muayene ettikten sonra akşam yemeğinde İçişleri Bakanı Şükrü
  Kaya'ya söylenmiştir. Türkçe metin, Dağlı'nın aktardığı şekliyle Şehsuvaroğlu'na (1981, s. 77) aittir;
  Fiessinger'in muhtemelen Fransızca olan kendi sözleri verilmemiştir. 'Yata döneriz' ifadesi en doğal haliyle
  'yata (Atatürk'ün yatmakta olduğu Savarona'ya) döneriz' ('we go back to the yacht') anlamına gelir; buradaki
  İngilizce metinde 16 Kasım 2026'ya kadar, Türkçenin desteklemediği bir okuma olan 'tonight we go to bed'
  ('bu gece yatağa gireriz') yer almaktaydı. Sözlerine şöyle devam eder: 'Onun için siz Cumhuriyetin selameti
  için icabeden tedbirleri şimdiden alınız' (dolayısıyla Cumhuriyet'in selameti için gereken tedbirleri
  şimdiden alınız).

  makalesinin ilk satırları; bu sayfada numara yoktur (sonraki dört sayfada 131-134 basılıdır, dolayısıyla s.
  [130]'dur); içindekiler sayfası PDF s. 3); basılı tarih: Cüz künyesi: 'الجزء التاسع — المجلد الرابع عشر —
  قسنطينة — رمضان ١٣٥٧ ه — نـفامبر ١٩٣٨' (Ramazan 1357 / Kasım 1938). İçindekiler sayfası: 'صدر يوم الجمعة ٨
  ذي القعدة ١٣٥٧ الموافق ٣٠ ديسانبر ١٩٣٨' (yayın tarihi Cuma 8 Zilkade 1357 / 30 Aralık 1938; ay adının üçüncü
  harfi ص veya س olarak okunmaktadır).

voice: Abdelhamid Ben Badis
role: Cezayirli reformist alim; al-Shihab editörü
quote: Modern tarihte insanlığın tanıdığı en büyük adam
quote_kind: translated
summary: >-
  Onu modern tarihin en büyük adamı, bir dahi, Türkiye'nin kurtarıcısı olarak nitelendirdi; İslam'a değil
  sözde Müslümanlara başkaldırdığını söyleyerek suçu din adamlarına da yaydı.
caveat: >-
  Özgün metin okundu (r7): al-Shihab 14/9, 'مصطفى كمال رحمه الله', Ben Badis imzalı, s. 131–134 (başlık
  sayfası s. 130 çıkarımla belirlenmiştir); kapak ayı Kasım 1938, içindekiler sayfası yayın tarihini 30 Aralık
  1938 olarak verir. Çekinceler: İslam'a karşı tutumu 'Müslümanın kalbini daralttı'. Arapça metin, dizgicinin
  atladığı hemzeler olmadan basıldığı gibidir; tarama üzerinden okunmuştur (archive.org Alshehab-mag,

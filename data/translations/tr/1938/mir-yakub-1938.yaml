voice: Mir Yakub / Azerbaycan Milli Komitesi
role: Azerbaycanlı sürgün komitesi, Paris
quote: bu gün yabancı hükmü altında inleyen Azerbaycan
quote_kind: original-turkish
summary: >-
  Paris'ten çektiği telgrafta, yabancı boyunduruğu altında inleyen Azerbaycan'ın onun yasını bile özgürce
  tutamadığını; ulu şefin hatırasının Azeri kalplerinde yaşayacağını bildirdi.
caveat: >-
  Paris'ten telsiz telgraf, 11/11 13:12, 'mir yakub azerbaycan milli heyet reisi' imzalı (c. II, PDF s. 51,
  yaprak 48). Küçük harflerle, çoğunlukla Türkçe harfler olmadan ve dizgi hatalarıyla ('tazuyetlerimizi',
  'saferlerle') daktilo edilmiştir; alıntı bu sözleri standart imlayla vermektedir. Onun hakkında şöyle
  denmektedir: 'ulu sefin tukenmez saferlerle dolu hatiralari kalplerimizde ebediyyen yaşayacaktir' (ulu şefin
  tükenmez zaferlerle dolu hatıraları kalplerimizde ebediyen yaşayacaktır). Alıntılanan cümle şöyle devam
  etmektedir: 'bu en buyuk mateme butun varligile istirake hazirlanirken malum vahsi penceleri onunde elim
  acilerini bile doya doya duymak imkansizligi karsisinda bulunuyor' (bu en büyük mateme bütün varlığıyla
  iştirake hazırlanırken malum vahşi pençeleri önünde elim acılarını bile doya doya duymak imkânsızlığı
  karşısında bulunuyor).

id: zafar-ali-khan-1938-11-poem
voice: Zafar Ali Khan
role: Urdu şairi ve Zamindar'ın editörü
quote: >-
  Dünyadan o en büyük mücahit göçüp gitti ... Ey gönül sahipleri, bu keder Mustafa Kemal'in kederidir
quote_kind: translated
summary: >-
  Topluluğun sıkıntılarını hafifleten, haçlılara karşı Türklerin onurunu yeniden kazandıran ve Kabil'den
  Ankara'ya dek ayakta duran 'en büyük mücahid'in yasını tutan bir mersiye.
caveat: >-
  Alıntı iki mısra yarısından oluşmaktadır. 'Ataturk Mustafa Kemal, nawwara llahu marqadahu' başlıklı, Delhi,
  12 Kasım 1938 tarihli şiir. Kaynak: Diwan-e Zafar Ali Khan, haz. Tanvir Ahmad (Ali Hujwiri Publishers,
  Lahor, 1995 baskısı), s. 210 (archive.org taramasının 210. PDF sayfası; OCR kullanılamaz durumda, sayfa
  görüntü üzerinden okundu), görüntü üzerinden okundu (4 Kasım 2026). 14 Kasım tarihli Meclis konuşmasından
  ayrıdır. Eşlik eden 'Congressi ulama' şiiri (s. 211, Delhi 13 Kasım 1938), Tanrı'dan bir Mustafa Kemal daha
  göndermesini dileyerek sona erer; ayrı olarak kaydedilmemiştir. Kontrol: mısra yarıları sayfadaki sırayı
  izleyecek şekilde yeniden sıralandı (matem mısra yarısı 'mujāhid-i aʿẓam' ifadesinden önce gelir).

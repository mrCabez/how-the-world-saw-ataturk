voice: Hafız Ramazan Paşa
role: Mısırlı senatör
quote: Kemal Atatürk olmasaydı yeni bir Türkiye görecek miydik? Belki hayır.
quote_kind: original-turkish
summary: >-
  Mustafa Kemal ile 1912'de ve daha sonra yeniden Ankara'da görüştü; yenilmez bir irade gördü; Mısır sorununun
  Lozan'da sonuçlandırılmasını Atatürk'ün başarısına bağlar.
caveat: >-
  Not, Lozan iddiasını Mısır'ın kendi çıkarının konuşması olarak nitelendirir. Türkçe metin makalede basıldığı
  gibidir (s. 201, dn. 106); sözlerinin Türk basınındaki aktarımıdır. Toksoy'un 2006 tarihli makalesi (s. 157,
  dn. 55: Ulus 18 Kasım 1938 s. 5) aynı giriş cümlelerini ve sonraki birkaç ifadeyi bir Fransız gazeteci olan
  'Pier Dominik'in bir yazısından alınmış olarak basar. İki makaleden hangi atfın doğru olduğu
  kesinleştirilemez.

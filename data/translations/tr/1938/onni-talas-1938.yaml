voice: Onni Talas
role: Finlandiya'nın Ankara büyükelçisi
quote: Bu büyük adam yalnız Türk milletinin değil bütün insanlığın malıydı.
quote_kind: original-turkish
summary: >-
  Türkler kadar kederlendi; Türkiye'de görülen ilerlemeyi, özellikle ekonomiyi övdü ve Fin-Türk ekonomik
  ilişkilerinin iyi olmasını umdu.
caveat: >-
  Alıntı, kayıp üzerine yaptığı açıklamadır; haberi Budapeşte'de duyduğunu söylemektedir. Toksoy yalnızca

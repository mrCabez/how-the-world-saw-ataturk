voice: Al-Fath
role: Kahire Selefi haftalık dergisi (Muhibb al-Din al-Khatib)
quote: Zira «Atatürk» Arapçayı Türklerin dilinden en kötü şekilde kovdu
quote_kind: translated
summary: >-
  Atatürk Arapçayı Türkçeden sürdü; İran Şahı da onu izleyerek Arapça kelimeleri tasfiye etti.
caveat: >-
  Sayı tarihi çıkarımla belirlenmiştir (1 Muharrem 1355 kapak yaprağı; 17 Mart 1936 tarihine atıfta bulunur).
  Alıntı, notta basılı olan Arapça özgün metnin not yazarı tarafından yapılan İngilizce çevirisidir. Arapça
  metin, dizgicinin atladığı hemzeler olmaksızın basıldığı gibidir; tarama üzerinden okunmuştur (archive.org
  efath-moheb-elden-elkheeb, 426_530_Efath_Moheb_Elden_Elkheeb.pdf, PDF s. 1395 = basılı s. 951 (sayı s. 3);
  makale PDF s. 1394 = basılı s. 950'de (sayı s. 2) başlar; kapak yaprağı PDF s. 1393); basılı tarih: Kapak
  yaprağı: 'القاهرة غرّة المحرّم ١٣٥٥' ve '(العام العاشر)' (Kahire, 1 Muharrem 1355, 10. yıl). Miladi tarih
  basılı değildir; sayı numarası cilt payında gizlenmiştir.. Taramada makale imzasız olmayıp s. 950'de 'بقلم
  حضرة صاحب الفضيلة الاستاذ الشيخ محمد سليمان نائب المحكمة العليا الشرعية' (Yüksek Şeriat Mahkemesi
  नाइbi/vekil üyesi Şeyh Muhammad Sulayman) imzasını taşımaktadır; alıntının basılı sayfası 950 değil 951'dir.
  Sayıda yalnızca 'غرّة المحرّم ١٣٥٥' (1 Muharrem 1355, 10. yıl) basılıdır.
verification_note: >-
  Arapça 'فإن «أتاتورك» طرد العربية من لغة الأتراك شر طردة وقفاه في العام الماضي شاه العجم' mevcut; sadık;
  sayfa al-Balagh 23 Zilhicce 1354 = 17/3/1936'ya atıfta bulunuyor, dolayısıyla tarih çıkarımı sağlam. Arapça
  metin 16 Kasım 2026'da ayrı bir okur tarafından sayfa görüntüsünden okunmuştur; o zamana kadar alıntı,

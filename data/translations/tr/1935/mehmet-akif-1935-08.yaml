  Antakya'da (o dönemde Fransız mandası altındaki Sancak) yaklaşık üç hafta kalmış ve 31 Ağustos 1935'te
  ayrılmıştır. Aynı raporlar, hilafetin kaldırılmasını 'en büyük bir dinsizlik' olarak nitelendirdiğini ve
  Abdülmecid'i övdüğünü belirtir; bunlar şahsen Kemal'le değil, rejimle ilgilidir. Aynı TBMM cildi, Kemal'in
  Âkif'in Burdur mebusu seçilmesini ayarlayan 1920 tarihli telgrafını da basmaktadır (Kemal tarafından kurulan
  bir temas). Âkif'in Mısır'dan yazdığı mektuplar açık kaynaklarda bulunamamıştır.

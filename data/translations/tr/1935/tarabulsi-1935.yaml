id: tarabulsi-1935
voice: Amjad al-Tarabulsi
role: Şamlı şair ve yazar ('Şam' imzasıyla)
quote: >-
  Eğer Arapları bir kenara atman çirkin idiyse ... kutsal dini bir kenara atman daha çirkindir
quote_kind: translated
summary: >-
  Ayasofya üzerinden Atatürk'ü adıyla azarlar: Arapları bir kenara atmak çirkindi, dini bir kenara atmak daha
  çirkindir ve Batı onu yutacaktır.
caveat: >-
  Hafiz Ibrahim'in bir epigrafıyla ('Ayasofya, the hour of parting has come') açılan uzun bir kaside olan
  'Ayasufya' (Ayasofya) şiiri; al-Risala'da (Kahire) sayı 109, 5 Ağustos 1935'te basılmıştır, metin ilgili
  sayının Arapça Wikisource transkripsiyonundan alınmıştır; orada sayfa numarası verilmemiştir. Atatürk'e iki
  kez adıyla hitap edilir ('Atatürk, do not let your command deceive you'; 'Atatürk, beware a leap from the
  sons of the West') ve şiirin ikinci yarısı onu hedef alır; dolayısıyla vesile kilise-cami olsa da muhatap
  odur. Şöyle kapanır: 'Beware the West... their peace is an armed peace.' Yazar yalnızca 'Amjad al-Tarabulsi,
  Damascus' imzasıyla tanımlanmaktadır; doğum ve ölüm tarihleri tespit edilememiştir.
verification_note: >-

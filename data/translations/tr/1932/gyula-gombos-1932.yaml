voice: Gyula Gömbös
role: Macaristan Başbakanı
quote: Büyük reisinizin dehası ile yapılan büyük inkılaptır.
quote_kind: original-turkish
summary: >-
  Türkiye elçisine ırk bağlarından ve savaştan gelen saygıdan söz etti ve devrime hayranlığını dile getirdi;
  amacı Trianon'un revizyonu olsa da daha sonra Ankara'yı ziyaret etti.
caveat: >-
  Kaynak, başbakanlık tarihini farklı vermektedir (özette 1930, Erdem'de ise Ekim 1932; 1932 kullanılmıştır).
  Türkçe metin, Gömbös'ün 14 Ekim 1932'de elçiye söylediklerinin Erdem'de basıldığı şekliyle elçi raporudur:
  “Benim kafam Türk’tür. Türklere karşı üç noktada pek güçlü bağlar ile merbutum. 1. Bir ırktan, Asyalı
  olmaklığımız. 2. Harbi Umumi’de Türklerden gördüğüm yüksek askerlik yeteneği. 3. Büyük reisinizin dehası ile
  yapılan büyük inkılaptır.” (My head is Turkish. Three things bind me strongly to the Turks: 1. that we are
  of one race, Asians; 2. the high soldierly ability I saw in the Turks in the Great War; 3. the great
  revolution made by the genius of your great leader.) Hangi dilde konuştuğu belirtilmemiştir.

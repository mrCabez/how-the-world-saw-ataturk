id: rusafi-1923
voice: Ma'ruf al-Rusafi
role: Iraklı şair, öğretmen ve milletvekili
quote: Yunan oğullarına karşı, Batı'yı kargaşa ve karışıklık içinde bırakan bir zafer kazandın.
quote_kind: translated
summary: >-
  Kemal'e, Yunanlılara karşı kazandığı zaferle Batı'yı kargaşaya sürükleyen ve yeni bir Doğu güneşi yakan
  'Büyük Doğu'nun kahramanı' diye seslenir.
caveat: >-
  Açılış dizesinde "Mustafa" ve "Kemal" kelimeleriyle söz oyunu yapılan "Ila batal al-sharq al-akbar" ("To the
  hero of the greater East", "Büyük Doğu'nun Kahramanına") kasidesi; Diwan al-Rusafi'de (4. basım, Kahire:
  I'timad, 1953), s. 440'ta basılmıştır ve Mustafa Saka'nın baskısında "Gazi Mustafa Kemal'in 1923'te
  Yunanlılara karşı kazandığı zaferden sonra söylenmiştir" başlığını taşır (Al-Chalaby, not 10). Al-Chalaby,
  1923 tarihinin 1922 yerine olası bir dizgi hatası olduğunu değerlendirir (veya şiir Lozan ya da Cumhuriyet
  sonrasına aittir). Arapça metin Al-Chalaby 2019, RumeliDE Dil ve Edebiyat Araştırmaları Dergisi, Ö5, s.
  176-186'da ve "Dünya Şairlerinden Atatürk Şiirleri" (sayı 46) derlemesinde basıldığı şekildedir. Kaside
  ayrıca Kemal'i ulusun İsa benzeri bir şifacısı olarak nitelendirir ve İzmir'in kızlarını "her kaba saba
  adamın elinden" kurtardığını söyler; Al-Chalaby, "pek çok Arap şairin" zaferleri "görmezden geldiğini"
  ekler. Rusafi'nin Türkçe eserleriyle karıştırılmamalıdır; şiir klasik Arapçadır.
verification_note: >-
  Arapça 'نصرت على بني يونان نصرا / أقام الغرب في هرج ومرج' mısraları tek bir beytin ardışık iki yarısıdır ve
  bu şekilde basılmıştır; makalenin 10 numaralı dipnotu şiir için 'Mustafa Saka, a.g.e. s.440' kaynağını
  gösterir; 'said in 1923 after Gazi Mustafa Kemal's victory over the Greeks' şeklindeki başlık notu
  al-Chalaby'nin kuşkusuyla (1922 veya Lozan sonrası) birlikte aktarılmıştır. İsa-şifacı ve İzmirli kızlar
  dizeleri mevcuttur. Hayranlık/2 değerlendirmesi yerinde. Diwan sayfası yalnızca al-Chalaby'nin dipnotu
  üzerinden doğrulanmıştır.
verification_method: >-

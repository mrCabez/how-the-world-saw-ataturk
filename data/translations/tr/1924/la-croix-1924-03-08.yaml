voice: La Croix
role: Paris Katolik günlük gazetesi
quote: >-
  Onlara Fransa'daki Tarikatların meşhur milyarından söz edenler, kuşkusuz o milyarın nasıl buharlaşıp
  gittiğini söylemeyi ve kürek mahkûmu Duez'in hikâyesini anlatmayı ihmal etmişlerdir.
quote_kind: translated
summary: >-
  'Gazette' başlığı altında, Ankara'nın hilafeti kaldırmasının, Fransız 'milliard des Congrégations' örneğiyle
  yanıltılarak cami mallarını hedef aldığını öne sürdü; Kemal'in adı geçmez.

  (künye: sayı 22 329, 5 Mart 1924 Çarşamba). Yazı şöyle devam ediyor: 'la jeune république turque ne pense
  qu'à couper tous les liens avec le passé et montre comme une soif d'isolement' ve hilafeti kaldırmadan önce

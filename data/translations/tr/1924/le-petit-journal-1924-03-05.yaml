voice: Le Petit Journal
role: Paris popüler günlük gazetesi
quote: >-
  Mustafa Kemal Paşa ve taraftarlarının akıl yürütmesi son derece basittir. Türkiye'yi büyük Batılı
  devletlerden tamamen bağımsız, diğer İslam devletlerinden bağımsız ve sultanların eski Türkiye'siyle olan
  tüm bağlarından kopmuş modern ve Avrupalı bir ulus yapmak istiyorlar.
quote_kind: translated
summary: >-
  Kemal'in akıl yürütmesini geçmişle tüm bağlarını koparmış modern bir Türkiye, 'bir yalnızlık susuzluğu'
  olarak açıkladı ve hilafetin kaldırılmasını dini bir intihar olarak nitelendirdi.
caveat: >-

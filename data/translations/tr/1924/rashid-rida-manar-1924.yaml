id: rashid-rida-manar-1924
voice: Rashid Rida
role: Selefi ilahiyatçı; al-Manar editörü
quote: Hatta diyorum ki, razı olsun ya da öfkelensin, İslam âlemini artık umursamaz hale geldiler
quote_kind: translated
summary: >-
  Kaldırma kararının savunucuları arasında Mustafa Kemal ve partisi de yer alır; Kemalistler artık Müslüman
  dünyasının memnun mu yoksa öfkeli mi olduğunu umursamamaktadır.
caveat: >-
  al-Manar c. 25, cüz 4, s. 285, 'إلغاء الترك للخلافة والمصالح الاسلامية' (Türklerin hilafeti kaldırması ve
  İslam'ın menfaatleri) başlıklı makalede. Cüzün iç kapağı 30 Ramazan 1342 / 4 Mayıs 1924 tarihlidir ve burada
  verilen tarih budur. 'Onlar' dediği 'هؤلاء الكماليون'dur (bu Kemalistler); cümle şöyle devam eder: 'اذا كان
  رضاه أو سخطه لا يؤثر في الشعب التركي تأثيراً يحمله على معارضة الحكومة' (onun rızası veya öfkesi Türk halkı
  üzerinde halkı hükümete muhalefete sevk edecek bir etki yaratmadığı sürece). Sayfanın üst kısmında,
  hilafetin kaldırılmasını önceki Türklerin Abbasi hilafetine yaptıklarıyla savunanlar hakkında şöyle denir:
  'وهذا رأي مصطفى كمال وحزبه كما يعلم من خطبته التي جعلها مقدمة لهذا العمل' (bu işin mukaddimesi yaptığı
  konuşmasından bilindiği üzere, Mustafa Kemal ve partisinin görüşü budur). Arapça metin basıldığı şekliyle,
  hemzesiz yazılmıştır. archive.org PDF'inde sayfa numarası 210'dur.
verification_note: >-

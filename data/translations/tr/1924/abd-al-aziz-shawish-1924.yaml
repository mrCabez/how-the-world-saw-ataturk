id: abd-al-aziz-shawish-1924
voice: Abd al-Aziz Shawish
role: al-Akhbar için yazan Mısırlı yazar
quote: >-
  Mustafa Kemal, hilafet meselesinde Halife Abdülmecid Hazretleri'nin döneminde geçerli olan orta yolla
  yetinebilirdi
quote_kind: translated
summary: >-
  Kemal, Abdülmecid dönemindeki orta yolu koruyabilirdi; bir zamanlar bizzat kendisi de hilafete talip olmuş,
  bundan yalnızca huzursuzluk çıkması korkusuyla geri durmuştu.
caveat: >-
  Rida'nın yeniden basımı aracılığıyla aktarılmıştır; üç al-Akhbar makalesinden hangisinden alıntı yapıldığı
  bilinmemektedir. Alıntı, notta basılı olan Arapça özgün metnin not yazarı tarafından yapılan İngilizce
  çevirisidir. Arapça metin, dizgicinin atladığı hemzeler olmadan basıldığı gibidir; taramadan okunmuştur
  (archive.org Almanar, almanar25.pdf (al-Manar c. 25 kısım 4), PDF s. 215, basılı s. 290; Rida'nın girişi PDF
  s. 214 = basılı s. 289'da; kısım künyesi PDF s. 181 = basılı s. 241); basılı tarih: al-Manar 25(4) künyesi,
  s. 241: '٣٠ رمضان ١٣٤٢ — ١٤ الثور ١٣٣٠ ه ش — ٤ مايو ١٩٢٤' (30 Ramazan 1342 / 4 Mayıs 1924; şemsi-hicri yıl
  ١٣٣٠ olarak basılmıştır). s. 289'da verildiği şekliyle al-Akhbar sayısı: 'صدر في ٣ رجب الموافق ٦ مارث' (3
  Recep / 6 Mart)..

quote: Buna karşılık bu ilkeler Mustafa Kemal Paşa tarafından anlaşılmakta ve korunmaktadır.
quote_kind: translated
summary: >-
  Yeni politikayı laik ve millî olarak nitelendirdi ve Halife'nin protestosuna karşı bu politikanın
  ilkelerinin Kemal tarafından anlaşılıp korunduğunu belirtti.
caveat: >-
  Birinci sayfa, Paris, 4 Mart tarihli 'Bulletin du jour: La suppression du khalifat' başlıklı başyazıda. Söz

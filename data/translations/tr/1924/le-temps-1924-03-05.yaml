  yaptığı anlaşıldığı üzere yabancı nüfuza dayananlar bunları 'méconnaissent complètement'. Yazı, Kemal'in 22
  Şubat'ta İzmir'de ordu üzerine yaptığı konuşmadan alıntı yaparak devam eder ve Türkiye'nin mevcut gidişatını
  bir 'évolution qui a pour double but de rendre au peuple turc la plénitude de ses qualités originelles et
  d'ouvrir son esprit aux progrès de l'Occident' olarak adlandırır. Aynı başyazıdaki 'on va trop loin'
  ifadesi, hilafetin kaldırılmasının Hint Müslümanlarını kızdırdığı yönündeki Londra haberlerine kendi verdiği
  yanıttır.

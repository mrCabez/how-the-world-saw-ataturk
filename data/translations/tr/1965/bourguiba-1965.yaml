id: bourguiba-1965
voice: Habib Bourguiba
role: Tunus Cumhurbaşkanı
quote: Sakarya Harbi, Sakarya Zaferi, 20 yaşımın en kuvvetli hâtırası olmuştur.
quote_kind: original-turkish
summary: >-
  Sakarya'yı Atatürk'ün mucizesi, Mustafa Kemal'i ise örnek kahraman olarak nitelendirir; ancak Arapların
  çekincesini Atatürk'ün dine karşı tavrıyla açıklar.
caveat: >-
  TBMM Tarihe Düşülen Notlar-2 (2012), PDF s. 43 (basılı s. 32). Konuşma TBMM tutanaklarındaki gibi Türkçe
  basılmıştır. Aynı konuşma: 'Sizin Kemalist ihtilâliniz ise, bizlere maya oldu' (PDF s. 48, 'your Kemalist
  revolution became leaven for us') ve PDF s. 44'te Arap tereddüdü 'bu liderin din ve din müessesesine karşı
  takındığı tavırlar'a (this leader's stance toward religion and religious institutions) bağlanmakta olup,
  Bourguiba 'çok radikal hükümler'e katılmamaktadır. Başlık: 'Tunus Cumhurbaşkanı Habib Burgiba', 25 Mart
  1965. Mevcut kişi notu daha sonraki Kemalist programını kapsamaktadır. Kontrol edenin notu: Bourguiba,
  Atatürk ve din hakkındaki 'radikal hükümler'le arasına mesafe koyar; eleştirel pasaj kendi hükmünü
  belirtmekten ziyade Arap çekincesini açıklamaktadır.
mediated_by: TBMM tutanakları (Türkçe sözlü çeviri)

  Bourguiba'nın kendisi bu sert yargıya katılmaz; dolayısıyla eleştirel not açıkça kendi hükmü değil,
  Arapların çekincesinin bir açıklamasıdır. Muhtemelen Fransızca yapılmıştır; kitap Türkçe basmıştır;

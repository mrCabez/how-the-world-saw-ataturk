id: sabahattin-ali-1933-04-14
voice: Sabahattin Ali
role: Türk romancı ve şair; Konya Hapishanesi'nde tutuklu Almanca öğretmeni
quote: >-
  Beni en çok üzen yediğim ceza değil, sizin büyük isminizin şahsî intikam vasıtası olarak kullanılabilmesi ve
  buna müsamaha edilmesi keyfiyetidir.
quote_kind: original-turkish
summary: >-
  Gazi'ye hakaret ettiği söylenen bir şiir yüzünden hapse atılınca ona mektup yazarak suçlamayı reddeder,
  büyük isminin şahsi intikama alet edilmesinden üzüntü duyduğunu belirtir ve af diler.
caveat: >-
  'Reisicumhur Gazi Mustafa Kemal Hazretlerine' başlıklı, '14- IV - 1933' tarihli, 'Konya Hapisanesinde
  mevkuf, Konya Muhtelit Ortamektep almanca muallimi Sabahattin Ali' imzalı, damga pullu, büro derkenarlı ve
  'Cumhurbaşkanlığı Arşivi' damgalı daktilo edilmiş dilekçe. Birbiriyle uyuşan tıpkıbasımdan (Wikimedia
  Commons, kaynak olarak 10 Ağustos 2018 tarihli bir Habertürk görseli verilmiştir) ve tashih edilmiş
  tr.wikisource transkripsiyonundan (kalite düzeyi 4) okunmuştur. Bir şiirinde Cumhurbaşkanı'na 'zimnen ve
  telmihan hakaret' ettiği gerekçesiyle aldığı bir yıllık hapis cezasını çekmekteydi; önce kendisine
  inanılmasını ('Ben böyle bir şey yapmadım'), ardından af ('Beni affedecek kadar büyük ve iyi kalpli
  olduğunuzdan eminim') talep eder. Bir af dilekçesindeki övgü sözleri olduğundan araçsaldır. Kemal'in yanıt
  verip vermediği burada tespit edilememiştir (1933 affıyla serbest bırakılması M kademesindedir,
  doğrulanmamıştır). Şiirin kendisi bulunamamıştır.

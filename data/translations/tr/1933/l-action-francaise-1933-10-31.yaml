voice: L'Action française
role: Kralcı-milliyetçi günlük gazete
quote: >-
  Mustafa Kemal'in zaferinin Yunan megalomanisinin feci iflasına yol açtığı 1922 yazından bu yana Yunanistan
  boyun eğmiştir: yeni bir Helen Bizans'ına dair 'Büyük İdea'dan geriye, kendisine yalnızca bedeli ağır
  ödenmiş muazzam yanılsamaların anısı kalmıştır.
quote_kind: translated
summary: >-
  Türk-Yunan dostluğunun arka planı olarak, Mustafa Kemal'in 1922'deki zaferinin Yunan megalomanisinin 'feci
  başarısızlığına' yol açtığını hatırlattı.
caveat: >-
  'Du nouveau dans les Balkans', Jacques Arnauld imzalı (Bainville veya Maurras değil), sayfa 1, sütun 6'nın
  altından sayfa 2'ye uzanıyor (künye: 26. yıl, sayı 304, 31 Ekim 1933 Salı); cümle sayfa geçişinde bölünüyor
  ('méga-' / 'lomanie'). Kemal'in adı yalnızca burada geçiyor; geri kalanı Bulgaristan, Küçük Antant ve Fransa
  hakkında. Devamı şöyle: 'Et vite, la Grèce … comprit qu'un seul parti lui restait : se réconcilier avec son
  vainqueur. Ainsi naquit l'amitié gréco-turque.'

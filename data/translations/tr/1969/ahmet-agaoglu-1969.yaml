voice: Ahmet Ağaoğlu
role: Liberal milletvekili ve siyasi yazar, Serbest Cumhuriyet Fırkası'nın kurucularından (1930)
quote: >-
  Gazi'ye karşı takınılmasını daima bir namus ve şeref borcu, bir Vatan ve Türklüğün icabı olarak kabul etmiş
  olduğum doğruluktan ve açıklıktan bu kerre de ayrılmadım. "Bu biraz fazla sunidir!.." dedim
quote_kind: original-turkish
summary: >-
  1930'da Yalova'daki sofrasında Gazi'ye önceden kurgulanmış bir muhalefet partisinin fazla suni olduğunu
  söylediğini hatırlatır; Kemal önce sinirlenmiş, sonra gülmüştür.
caveat: >-
  Olay: Yalova, Ağustos 1930, Fethi'nin ve Kemal'in mektupları okunduktan sonra. TARİH: Soyak anıları 'kısmen
  neşredilen' olarak adlandırır; ilk baskı yılı olan 1969 M kademesindedir (doğrulanmamıştır); Ağaoğlu 1939'da
  öldüğünden metin 1930-39 yılları arasında yazılmıştır. Fethi aracılığıyla, Kemal'in 'biraz hürriyet havası'
  istediğini ancak CHP'nin bir kanadı olacak bir parti arzuladığını aktarır. Soyak, Kemal'e sadık biridir ve
  kendi notlarını ekler. archive.org OCR metninden okunmuştur; tırnak işaretleri standartlaştırılmış ve satır
  sonu bölünmesi olan 'suni- dir' birleştirilmiştir. Kontrol: 1969 Baha Matbaası baskısı kaynak
  gösterilmektedir, ancak tarihsiz bir Nebioğlu baskısı da mevcuttur; 1969 ilk baskı olmayabilir.

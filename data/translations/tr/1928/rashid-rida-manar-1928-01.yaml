id: rashid-rida-manar-1928-01
voice: Rashid Rida
role: Selefi ilahiyatçı; al-Manar editörü
quote: >-
  Görüş ve basiret sahibi toplum bilimciler, Mustafa Kemal'in atılımının kendi kavmi için daha tehlikeli
  olacağını tahmin ediyorlar
quote_kind: translated
summary: >-
  Sosyologlar Kemal'in sıçramasını halkı için daha tehlikeli buluyor; eski bir devlet ölmeden önce parlar.
caveat: >-
  İmzasız; editör sıfatıyla Rida'ya atfedilmiştir. Alıntı, araştırma notunda basılı olan Arapça özgün metnin
  not yazarı tarafından yapılan İngilizce çevirisidir. Arapça metin, dizgicinin atladığı hemzeler olmadan
  basıldığı gibidir; tarama üzerinden okunmuştur (archive.org Almanar, almanar28.pdf (al-Manar c. 28 cüz 10),
  PDF s. 567, basılı s. 785; cüz künyesi PDF s. 528 = basılı s. 721); basılı tarih: '٣٠ رجب سنة ١٣٤٦ ه — ٢ برج

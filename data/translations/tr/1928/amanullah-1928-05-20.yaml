  sayfası önceki paragraflar için Akbaş tarafından, bu paragraf için ise Sarıhan/Hizmet tarafından kaynak
  gösterilmiştir. Ev sahipleri arasında kadeh kaldırma konuşması: aynı zamanda tören niteliği taşır.

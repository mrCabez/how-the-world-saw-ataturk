quote: Anadolu'da Mustafa Kemal Paşa şahsen beni rakib telâkki
quote_kind: original-turkish
summary: >-
  Cemal'e, Anadolu'da Mustafa Kemal'in şahsen kendisini rakip olarak gördüğünü söyler; buna karşın Kemal'e
  karşı bir hareketleri olmadığını iddia eder.
caveat: >-
  Türkçe özgün metin. Mektup No. 120, Enver'den Cemal Paşa'ya (Kâbil), 22 Temmuz 1921; aynı mektupta Kemal'in
  Hâkimiyet-i Milliye'de 'yalnızca beni hedef alan' bir yazı yazdırdığı ve 'Mustafa Kemal Paşa aleyhinde
  hiçbir hareketimiz yoktur, bilakis menfi arkadaşları teskin etmeye çalışıyoruz' denmektedir. Kemal'e değil,
  bir müttefike yazılmıştır; s. 234-235 olarak atıf yapılmıştır (235 numaralı OCR işareti cümlenin ardından
  gelir). Alıntı s. 235'tedir; 'Kemal aleyhinde hiçbir hareketimiz yoktur' cümlesi s. 236'dadır.
verification_note: >-

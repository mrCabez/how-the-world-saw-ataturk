id: ahmad-shawqi-1922
voice: Ahmad Shawqi
role: Mısırlı 'Şairler Prensi'
quote: >-
  Allahu ekber, fetihte nice harikalar var / Ey Türklerin Halid'i, Arapların Halid'ini yenile
quote_kind: translated
summary: >-
  Yunan savaşı ve Lozan galibini, Araplar için Halid bin Velid'i yenileyen 'Türklerin Halid'i' olarak gördü.
caveat: >-
  Şiirdeki Lozan göndermesinden hareketle tarihlendirilmiştir (konferans 20 Kasım 1922'de açıldı); taramada
  tarih yoktur. Alıntı, notta basılı olan Arapça özgün metnin not yazarı tarafından yapılan İngilizce
  çevirisidir. Arapça metin, dizgicinin atladığı hemzeler olmadan basıldığı gibidir; taramadan okunmuştur
  (archive.org elshandawily1184, 'الشوقيات -ج1.pdf' dosyası (al-Shawqiyyat c. 1, Dar al-'Awda), PDF s. 60,
  basılı s. 59; 'انتصار الأتراك فى الحرب والسياسة' başlıklı şiirin ilk dizesi).
verification_note: >-
  'Intisar al-Atrak fi'l-harb wa'l-siyasa' şiirinin Arapça 1. dizesi tam olarak 'الله أكبر، كم في الفتح من عجب
  / يا خالد الترك جدد خالد العرب' şeklindedir; 1. dipnot Khalid al-Turk'ü al-Ghazi Mustafa Pasha Kemal olarak
  tanımlar; çeviri sadıktır. 1922 tarihi, uyarı notunda belirtildiği üzere (Lozan göndermesinden)
  çıkarılmıştır. Arapça metin 16 Kasım 2026'da ayrı bir okur tarafından sayfa görüntüsünden okunmuştur; o
  zamana kadar alıntı, araştırma notundaki Arapça metnin İngilizce çevirisiydi.

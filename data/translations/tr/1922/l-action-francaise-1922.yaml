voice: L'Action française
role: Paris kralcı-milliyetçi günlük gazetesi
quote: >-
  Aynı şekilde, Mustafa Kemal ılımlı görünüyor. Yakında daha da cesaretlenmeyeceği kesin değil.
quote_kind: translated
summary: >-
  Mustafa Kemal ve Fethi Bey'in açıklamalarını ılımlı olarak değerlendirdi ve gecikmesi halinde daha da
  cesaretlenebileceği uyarısında bulunarak hızlı bir barış çağrısı yaptı.
caveat: >-

id: nazrul-1922
voice: Kazi Nazrul Islam
role: Bengalli şair (daha sonra Bangladeş'in ulusal şairi)
quote: Kemal, sen bir mucize yarattın kardeşim
quote_kind: translated
summary: >-
  Kemal'i, bilenmiş kılıcıyla düşmanı Hades'e gönderen savaşçı olarak 'Kemal, bir mucize yarattın kardeşim'
  nakaratıyla selamlar.
caveat: >-
  Bengal alfabesiyle yazılmış metne ulaşılamadı (bn.wikisource, Agni-Veena'daki 'Kamal Pasha' şiirini
  barındırmıyor); nakarat, hakemli BRIQ makalesinde (s. 74) Latin harfli çeviriyazıyla aktarılmıştır
  (İngilizcesi makaleye aittir). Agni-Veena (Kalküta, Kartik 1329 = Ekim 1922) içindeki 'Kamal Pasha' şiiri
  (BRIQ'e göre 'bilindiği kadarıyla' yakl. Ağustos-Eylül 1921'de yazılmıştır). Bir forumda (defencehub,
  çevirmeni belirsiz) tam İngilizce çevirisi ('Brother Kemal, the desperate son of a frenzied mother... Bravo
  to your sharpened sword... Tell me now, who is there on earth not afraid of Turkish sword?') yer alır;
  şiirin (Nurul Huda'nın 1997/1999 tarihli İngilizce çevirisinden yapılan) Türkçe çevirisi, Kemal Özcan
  Davaz'ın 'Atatürk, Bangladeş, Kazi Nazrul İslam' (Atatürk Araştırma Merkezi, 2000, s. 79-97) çalışmasına
  atıfla 'Dünya Şairlerinden Atatürk Şiirleri' içinde basılmıştır. Şiirde Enver Paşa'nın (Anwar Pasha) adı da
  geçer, dolayısıyla saf bir Kemalist metin değildir; BRIQ, Nazrul'u Kemal'i pan-İslamist 'Ümmet' bağlılığı
  içine dahil ediyor şeklinde okur. Şiirin konusu Kemal olduğundan kapsama alınmıştır. Kontrol: nakarat,
  Agni-Veena'daki (Ekim 1922) 'Kamal Pasha' şiirinin Bengalce metninde (bangla-kobita.com ve diğer
  çeviriyazılar) askerlerin korosudur; BRIQ bunu 1988 tarihli bir hatıradan alır.
verification_note: >-
  Nakarat şiirin Bengalce metninde bulundu ('কামাল! তু নে কামাল কিয়া ভাই!'), dolayısıyla Agni-Veena'nın (Ekim
  1922) altıncı şiiri olan 'Kamal Pasha'nın nakaratı GERÇEKTEN budur. Şiirde bu dize, yürüyüş halindeki
  askerlerin söylediği korodur (bir havildar-major içeren sahne tarzı şiir) ve 'Bravo to your sword / sent the
  enemy to Hades / who does not fear the Turkish sword' dizeleri orada mevcuttur. BRIQ s. 74 Latin harfli
  nakaratı açıklamasıyla birlikte basar, ancak bunu şiirden değil 'Odud 1988' tarihli bir hatıradan alır;
  '(Kamal, you have achieved unbelievable success, brother!)' ifadesi bir açımlamadır. Tarih: 1922, Agni-Veena
  basım tarihidir; daha erken yayımlanmış olması (Moslem Bharat, BRIQ'e göre yazılışı Ağustos-Eylül 1921)
  muhtemeldir ama kesinleştirilmemiştir; her iki durumda da 1921-22 dönemi çağdaştır. İhtirazi kayıttaki
  'Bengali text not retrieved' ifadesi artık geçerliliğini yitirmiştir: Bengalce metne atıf yapılabilir.

id: hemingway-1922-10-24
voice: Ernest Hemingway
role: Amerikalı muhabir, Toronto Daily Star muhabiri (23 yaşında)
quote: >-
  Mustafa Kemal Paşa birkaç ay önce İslam dünyası tarafından yeni bir Selahaddin olarak görülüyordu. … Şimdi
  Doğu ona güvensizlik duymaya başlıyor. … Bunun nedeni, muzaffer general Kemal'in kendisini iş adamı Kemal
  olarak göstermiş olmasıdır.
quote_kind: translated
summary: >-
  İslam dünyasının yeni Selahaddin'i, kazanımları cebine koyup uzlaşan bir iş adamına dönüştü; Doğu ona
  güvensizlik duymaya başlıyor ve ardından Mezopotamya'nın petrolü üzerine bir savaş gelebilir.
caveat: >-
  Toronto Daily Star'ın 24 Ekim 1922 tarihli sayısındaki 'Turks Distrust Kemal Pasha' başlıklı haberin
  (gazetedeki başlığı: 'Turks Beginning to Show Distrust of Kemal Pasha'), 'CONSTANTINOPLE.—' mahreç
  satırından sonraki açılışı. Alıntıdaki hayranlık ve güvensizlik, onun aktardığı şekliyle İslam dünyasına
  aittir; 'Kemal the businessman' ise kendi okumasıdır. İki kesme işaretinde dışarıda bırakılan sözler
  şunlardır: 'He was to lead Islam into battle against Christianity and to spread a holy war through all the
  East.' ve 'Mohammedans I have talked to say: “Kemal has betrayed us.” There is no talk now of the holy war.'
  Kemal'in konumunu İrlanda'daki, somut kazanımları alıp daha fazlası için uğraşmayı planlayan Griffith ve
  Collins'inkine benzetir. Dedikodu olarak, Kemalist liderlerin çoğunun ateist ve Fransız masonu olduğunun
  söylendiğini aktarır. Kemal'in Yahudi kökenli olduğuna dair bir söylentinin çok az itibar gördüğünü söyler,
  ancak yüzünün 'does look Jewish' olduğunu ekler. Mezopotamya ve petrolü yüzünden Britanya ile çıkacak bir
  savaşa kadar Kemal'e yirmi ay biçer. Toronto Daily Star'ın kendisi görülmemiştir.

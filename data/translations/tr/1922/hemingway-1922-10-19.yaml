id: hemingway-1922-10-19
voice: Ernest Hemingway
role: Amerikalı muhabir, Toronto Daily Star muhabiri (23 yaşında)
quote: >-
  Bütün Doğu, Mustafa Kemal Paşa'nın büyük bir adam olduğunu söylüyor. En azından başarılı bir adam; ancak
  İstanbul'a girişi, şöhretinin ilk yenilgiyle her zaman sönen bir askeri ün balonundan mı ibaret olacağının,
  yoksa zaferinin kendisine getirdiği sorunlarla başa çıkabilen bir adamın büyüklüğü mü olduğunun ilk
  göstergesi olacaktır.
quote_kind: translated
summary: >-
  Bütün Doğu Kemal'e büyük bir adam diyor; onun başarılı olduğunu kabul ediyor ve bunun bir balon mu yoksa
  büyüklük mü olduğunu ilk kez İstanbul'a girişinin göstereceğini söylüyor.
caveat: >-
  Toronto Daily Star'ın 19 Ekim 1922 tarihli sayısındaki 'Waiting for an Orgy' başlıklı haberin kapanış
  paragrafları (gazetedeki başlığı: 'Constantinople Cut-Throats Await Chance for an Orgy'). Alıntının hemen
  öncesinde: 'I would hate to be Kemal with all the dangerous prestige of a great victory behind me and these
  problems ahead.' Hemen sonrasında, haberi bitirirken: 'The cards look stacked against him in Constantinople,
  but if he can accomplish a peaceful entry, keep his troops in hand, and see there is no reign of terror, it
  will be of greater permanent value to Turkey than many victories in Thrace.' Daha sonraki bir araştırmacı
  ilk cümleyi 'Pasha' olmadan, başka bir baskının sayfa numarasıyla aktarır; Scribner'ın 1985 baskısında haber
  s. 230-31'dedir. Toronto Daily Star'ın kendisi görülmemiştir.

id: le-temps-1922
voice: Le Temps
role: Paris yarı resmi günlük gazetesi
quote: >-
  Mustafa Kemal bir barış konferansına katılmaya hazır olduğunu beyan etti; ancak konferans Türk topraklarında
  yapılmazsa, Angora hükümeti tarafından oraya gitmesine izin verilmeyecektir.
quote_kind: translated
summary: >-
  İzmir yangınıyla birlikte, Kemal'in taşkınlık yapan askerler için ölüm cezası kararlaştırdığını ve bir barış
  konferansına hazır olduğunu bildirdi.
caveat: >-
  Her iki pasaj da 16 Eylül 1922 tarihli sayının (sayı 22321) 2. sayfasındadır. Barış konferansı cümlesi, 'Les
  conditions de paix de la Turquie / Déclarations de Moustapha Kemal' bölümünde yer alan, Kemal'in Daily
  Mail'den Ward Price'a verdiği mülakatın gazeteye ait imzasız özetidir; aynı bölüm onun sözlerini doğrudan da
  aktarır ('Il n'y a plus de raisons de se battre. Je désire sincèrement la paix.'; 'Nous ne voulons pas
  d'actes de vengeance … pour nous, le passé est le passé'). Ölüm cezası cümlesi ('Kemal pacha a édicté la
  peine de mort contre tous les soldats qui commettraient des excès. Cet ordre sera respecté.'), gazetenin
  Berlin'deki özel muhabirinden gelmekte olup Ankara posta nazırı Sabri Bey'in sözlerini aktarmaktadır. İzmir
  yangını s. 1'dedir ('Smyrne en feu', 'Smyrne brûle depuis douze heures'); bu telgraflarda Kemal'in adı
  geçmez. Her iki pasaja da 17 Eylül tarihli sayıda rastlanmamıştır.

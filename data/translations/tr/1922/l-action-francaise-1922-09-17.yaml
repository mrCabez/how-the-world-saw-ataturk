  4'te devam ediyor ve Robert Havard de la Montagne imzalı. Gazete, Eugène Lautier'nin L'Homme libre'deki
  yazısını inceliyor. Cümle tırnak işareti olmaksızın incelemeyi yapanın kendi dizgisiyle verilmiştir;
  dolayısıyla ya incelemecinin kendi yorumudur ya da Lautier'nin sonucunu özetlemesidir; dizgi bu ikisinden
  hangisi olduğunu netleştirmez. Bağlam: Kemal, Yunanlılarla müzakereye oturmadan önce İtilaf Devletleri'nin
  aracılığı yerine Yunan başkomutanından gelecek bir mütareke talebini tercih edeceğini söylüyor; Lautier de
  bunu Fransa'nın Kasım 1918 mütarekesiyle karşılaştırıyor. İnceleme şöyle bitiyor: 'Voilà un homme qui sait
  vouloir...'. (Basılı metindeki 'se méfie' ve 'raison' ifadeleri önceki kayıtta OCR hasarlıydı; o kaydın

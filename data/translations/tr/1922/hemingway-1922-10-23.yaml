id: hemingway-1922-10-23
voice: Ernest Hemingway
role: Amerikalı muhabir, Toronto Daily Star muhabiri (23 yaşında)
quote: >-
  Yaklaşık iki yıl önce Mustafa Kemal Paşa, Balfour Kontu tarafından adi bir haydut olarak kınanmıştı. En
  geniş anlamıyla söylemek gerekirse, en yüksek teklifi verene satılıktı. Onu Fransızlar satın aldı.
quote_kind: translated
summary: >-
  Kemal'in en geniş anlamıyla satılık olduğunu ve Fransızların onu satın aldığını söylüyor; bitkin Yunan kur'a
  askerlerine karşı kazandığı zaferin abartıldığını belirtiyor.
caveat: >-
  Toronto Daily Star'ın 23 Ekim 1922 tarihli sayısındaki, Mudanya görüşmesiyle açılan 'Russia Spoiling the
  French Game' başlıklı haberden. 'Common bandit' Hemingway'in aktardığı şekliyle Balfour'un ifadesidir; 'for
  sale' ve 'bought' ise 'speaking in the broadest sense' çekincesiyle yumuşatılmış kendi ifadeleridir.
  Fransa'nın karşılığında aldığı petrol imtiyazları söylenti olarak ('it is rumored') verilir. Zafer hakkında:
  'Kemal whipped the Greeks, as everyone knows. But when you realize that he was fighting a conscript army ...
  it was not the magnificent military achievement that it is made out to be.' Kemal'in Sovyet Rusya ile
  bağlarının onu Fransa ile güçlüklere sokmasını bekler. Fransız temaslarının belgelenmiş bir anlatımı değil,
  genç bir muhabirin büyük güç siyaseti okumasıdır. Toronto Daily Star'ın kendisi görülmemiştir.

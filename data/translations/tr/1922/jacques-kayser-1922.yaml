id: jacques-kayser-1922
voice: Jacques Kayser
role: Fransız radikal gazeteci
quote: Bu vesileyle sergilediği tutumdan ötürü Mustafa Kemal'i kınamak hata olur.
quote_kind: translated
summary: >-
  Kemal'i Sevr Antlaşması'nın yarattığı, Sovyet yardımı alan fakat Moskova'nın propagandacılarını dışarıda
  tutan bir pragmatist olarak sundu; kınanacak bir şey yoktu.
caveat: >-
  Jacques Kayser, L'Europe et la Turquie nouvelle (Paris: Les Presses universitaires de France, 1922; derleme
  nüshası damgası 1923), basılı s. 94 (Gallica görüntü 106). Söz konusu "vesile", Moskova ile yapılan ittifak
  antlaşmasıdır; cümle şöyle devam eder: 'Aux prises avec un ennemi acharné, il fut contraint par les
  nécessités vitales de sa patrie d'accepter l'aide de tous les défenseurs qui s'offraient. Il a saisi
  l'occasion russe en réussissant à ne se lier en aucune façon.' S. 93: 'il a interdit l'accès de son
  territoire aux propagandistes de Moscou'. Sevr pasajları (görüntü 64, 82) yeniden okunmamıştır.

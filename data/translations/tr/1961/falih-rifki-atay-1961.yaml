id: falih-rifki-atay-1961
voice: Falih Rıfkı Atay
role: Gazeteci ve milletvekili; Atatürk'ü yakın çevresinden anlatan yazar
quote: >-
  Atatürk de, kızıp darılır, barışıp gene bozuşur, bazan huysuzluğu, bazan keyfi tutar, bir müddet herhangi
  bir dedikodunun etkisi altında haksızlığa kadar gider, sonra pişmanlık duyar, üstelik alayı, şakayı sever,
  fâniliği size bana benzer tabiî bir insandı.
quote_kind: original-turkish
summary: >-
  Çankaya adlı anı kitabının önsözünde: Atatürk öfkelenen, kulaktan dolma sözlerle haksızlık edebilen ve
  bundan pişmanlık duyan doğal, fani bir insandı.
caveat: >-
  İlk baskının önsözü olan 'Birinci Baskının Önsözü'nden (Dünya Yayınları, 1961, iki cilt), kendi önsözü 2
  Mart 1968 tarihli olan daha sonraki tek ciltlik baskıda yeniden basıldığı şekliyle; Cumhuriyet
  tıpkıbasımının archive.org nüshasından okunmuştur, PDF s. 3. Aynı önsöz onu 'pek hesaplı bir adam' ve
  dostluklarının üstünde 'kendi kendine vefalı' bir lider olarak nitelendirir ve şöyle der: 'O da bal veren
  bir çiçek değil, her çiçeğin kendine göre balını almasını bilen bir arı idi'. Kitabın, başlangıç notunda
  belirtildiği gibi onun içkisi ve yalnızlığı üzerinde durup durmadığı kontrol edilmemiştir. 'İç Didişme'
  bölümünden bir pasaj ayrı bir kayıttır (falih-rifki-atay-cankaya-1924).

id: al-fath-1927
voice: Al-Fath
role: Kahire Selefi haftalık dergisi (Muhibb al-Din al-Khatib)
quote: >-
  Bu makale, Mısır'daki Kemalistlerin kuyruklarının —Ankara'daki Kemalistler gibi— «fikir özgürlüğü»
  iddiasında yalancı olduklarını göstermektedir.
quote_kind: translated
summary: >-
  Kemal'in uzun konuşmasının ardından al-Siyasa'ya yanıt verirken: Ankara'daki Kemalistler yalan yere fikir
  özgürlüğü iddiasında bulunuyor ve Mısır'a da vicdan işkencesi çektireceklerdir.
caveat: >-
  Konuşmanın Nutuk olarak tanımlanması not yazarına aittir. Alıntı, notta basılı olan Arapça özgün metnin not
  yazarı tarafından yapılan İngilizce çevirisidir. Arapça metin, dizgicinin atladığı hemzeler olmadan
  basıldığı gibidir; taramadan okunmuştur (archive.org efath-moheb-elden-elkheeb,
  001_125_Efath_Moheb_Elden_Elkheeb.pdf, PDF s. 1080, basılı s. 280 (sayı s. 8): sağ sütunun son satırı ve sol
  sütunun ilk iki satırı; künye PDF s. 1073); basılı tarih: 'العدد ٦٨ — القاهرة : الخميس ٢ جمادى الاولى سنة
  ١٣٤٦ — ٢٧ أكتوبر سنة ١٩٢٧ — السنة الثانية' (sayı 68, Perşembe 2 Cemaziyelevvel 1346 / 27 Ekim 1927, yıl 2).
verification_note: >-
  Arapça 'الكماليين في أنقرة كاذبون في دعوى الحرية الفكرية' ifadesi mevcuttur; al-Siyasa'ya yanıt verir,
  vicdanların azabından söz eder. 27 Ekim 1927 sayı tarihi künyeden yeniden okunmamıştır (bu sayfada
  değildir). Arapça metin 16 Kasım 2026'da ayrı bir okur tarafından sayfa görüntüsünden okunmuştur; o zamana
  kadar alıntı, araştırma notundaki Arapça metnin İngilizce çevirisiydi. İngilizce metin o zaman
  düzeltilmiştir.

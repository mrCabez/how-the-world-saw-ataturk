id: mahmut-esat-bozkurt-1940
voice: Mahmut Esat Bozkurt
role: Eski Adalet Bakanı (1924-30), Türk İnkılâp Enstitüsü profesörü
quote: >-
  Bu Türk oğlu, bu sade vatandaş, yarınki hür ve müstakil Türk milletinin, Türk ulusunun kurtarıcısı olacaktı.
  Ve oldu.
quote_kind: original-turkish
summary: >-
  Atatürk'ü, Erzurum'a sade bir vatandaş olarak girmek üzere komutanlıktan istifa eden ve milletin kurtarıcısı
  olan büyük bir feragat insanı olarak sunar.
caveat: >-
  Atatürk İhtilali, I (İstanbul Üniversitesi Yayınları, İnkılâp Enstitüsü dersleri; İstanbul: Burhaneddin
  Matbaası, 1940), s. 129 (archive.org OCR). Aynı sayfa 'Atatürk büyük ferağet sahibi idi' diye başlar ve
  birinci elden şunu ekler: 'Atatürkten bir çok defalar işittim' diyerek Kemal'in sade bir yurttaş olduğunda
  kendisini en güçlü adam hissettiğine dair sözlerini aktarır. Arşiv notundaki 'gökten indiği sanılan doğmalar
  değil, hayatın gerçekleri' (Medeni Kanun) ifadesi Kemal hakkında değildir ve kontrol edilmemiştir.

name: Translation fix / Çeviri düzeltmesi
description: A better English translation of a quote, or a better Turkish wording for a record. Most translations here were made by machine. / Bir alıntının daha iyi bir İngilizce çevirisi ya da bir kayıt için daha iyi bir Türkçe ifade. Buradaki çevirilerin çoğu makine çevirisidir.
title: "Translation / Çeviri: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Two kinds of translation live in the archive, and this form takes a fix for either:

        - **English:** a quote that is not in English has an English translation in the record (`quote.translation`). `translated_by` says who made it; most were made by machine and not yet read by someone who knows the language.
        - **Turkish:** the Turkish text of each record is in `data/translations/tr/<YYYY>/<id>.yaml`, made by machine translation.

        If the quote itself, the date or the source is wrong, use the "Correction / Düzeltme" form instead.

        Arşivde iki tür çeviri var ve bu form ikisi için de düzeltme alır:

        - **İngilizce:** İngilizce olmayan bir alıntının İngilizce çevirisi kaydın içindedir (`quote.translation`). Kimin yaptığını `translated_by` söyler; çoğu makineyle yapıldı ve o dili bilen biri tarafından henüz okunmadı.
        - **Türkçe:** her kaydın Türkçesi `data/translations/tr/<YYYY>/<id>.yaml` dosyasındadır ve makine çevirisiyle yapılmıştır.

        Alıntının kendisi, tarih ya da kaynak yanlışsa bunun yerine "Correction / Düzeltme" formunu kullanın.
  - type: input
    id: record
    attributes:
      label: Record / Kayıt
      description: The record's id or file path, or a link to it in the exhibition. / Kaydın kimliği (id) ya da dosya yolu, veya sergideki bağlantısı.
      placeholder: "lebrun-1938"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Which translation / Hangi çeviri
      options:
        - English translation of the quote / Alıntının İngilizce çevirisi
        - Turkish text of the record / Kaydın Türkçe metni
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: Field / Alan
      description: Which part of the text. For an English translation, choose quote. / Metnin hangi bölümü. İngilizce çeviri için quote seçin.
      options:
        - quote (alıntı)
        - summary (özet)
        - role (görevi)
        - caveat (çekince)
        - mediated_by (aktarım zinciri)
        - verification_note (denetim notu)
        - verification_method (denetim yöntemi)
        - voice (söz sahibinin adı)
        - other / diğer
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current translation / Şu anki çeviri
      description: Copy the text as it is now. If it is right as it stands and you only want to confirm it, say so here and leave the next box empty. / Metni şu anki haliyle kopyalayın. Olduğu gibi doğruysa ve yalnızca onaylamak istiyorsanız bunu buraya yazın, sonraki kutuyu boş bırakın.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested translation / Önerilen çeviri
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Why / Neden
      description: For example a mistranslation, a wrong term, a word of the period read in its modern sense, unnatural wording, or a name spelt the wrong way. / Örneğin yanlış çeviri, yanlış terim, dönemin bir kelimesinin bugünkü anlamıyla okunması, doğal olmayan ifade ya da yanlış yazılmış bir ad.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit / Teşekkür
      description: Optional. The name or GitHub handle to record with the translation, as its translator or as a reader who checked it. / İsteğe bağlı. Çeviriyle birlikte, çevirmeni ya da kontrol eden okuru olarak kaydedilecek ad ya da GitHub kullanıcı adı.
    validations:
      required: false
